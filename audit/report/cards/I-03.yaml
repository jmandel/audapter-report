# Full finding card I-03. Sections follow the fixed template (build.py REQUIRED).
id: I-03
log: I-03
notes: notes/interface.md#i-03
headline: >-
  A trial longer than 30 s loses its beginning, and the OST, trialLen mute and onset ramp restart at 30 s
severity: low
reach_kind: pitfall
reach: >-
  Not triggered: blab's longest recorded trials are 4.5 s (vsaSentence). Affects trials longer than 30 s, for example sustained phonation or passage reading with an OST.
settings:
  source: 'Hypothetical design: a plausible design, not one blab runs; blab''s default settings (getAudapterDefaultParams) unless listed.'
origin: upstream
since: >-
  Present since at least Audapter 2.1.5; the recorder grew from 14.4 s to 30 s in the blab-lab fork (commit 3c90a3a).
status:
- H
- F
what: >-
  Audapter's recorders hold 30 s at 16 kHz. When they are full, Audapter silently restarts its frame and data counters and keeps recording over the start. <code>getData</code>
  then returns only the part since the restart, and everything driven by those counters starts again: OST timing, the <code>trialLen</code> mute and the onset ramp.
scope: >-
  Affects any trial longer than 30 s, such as reading passages, continuous speech or long always-on blocks. Time-based OST rules after the restart may never fire.
  Shorter trials are unaffected.
example: >-
  A 35 s trial with a vowel every second, an OST that should enter state 2 at 32 s, <code>trialLen</code> 34 s and a 50 ms ramp. <code>getData</code> returns {returned_s:.1f}
  s ({rows_text} rows), starting at {returned_from_s:.0f} s. State 2 never comes. At 30 s the onset ramp restarts mid-vowel ({ramp_db:.1f} dB), and nothing is muted
  after 34 s.
figure_caption: 'One 35 s trial: what happened, and what getData returns afterwards.'
table:
- - synthetic
  - Recorder size / wrap time
  - '{maxRecSize} samples / {wrap_s:.0f} s at {sr} Hz'
- - synthetic
  - Returned by getData after a 35 s trial
  - '{returned_s:.1f} s'
- - synthetic
  - State 2 (due at 32 s)
  - never reached
- - synthetic
  - Onset ramp at 30 s / mute after trialLen
  - '{ramp_db:.1f} dB / not muted'
sketch: i03
asset_dir: i-03
audio:
- file: output_27_to_35s.wav
  role: observed
  offset: 27
audio_note: 'Heard output from 27 to 35 s: the fade-in at 30 s and the missing mute at 34 s.'
cause:
  summary: >-
    After each frame, <code>handleBuffer</code> checks whether the recorder is full and, if so, sets <code>frame_counter</code> and <code>data_counter</code> to 0.
    <code>getSignal</code> and <code>getData</code> return only the first <code>frame_counter</code> frames, and the OST, mute and ramps read the same counters.
  refs:
  - repo: blab-mex
    path: TransShiftMex/Audapter.cpp
    lines:
    - 2307
    - 2311
    hl:
    - 2307
    - 2309
    - 2310
    expect: frame_counter)*p.frameLen>=maxRecSize
    note: 'The silent wrap: both counters go back to 0; no flag is set.'
  - repo: blab-mex
    path: TransShiftMex/Audapter.h
    lines:
    - 165
    - 166
    hl:
    - 165
    expect: maxRecSize = 480000
    note: '480000 samples: 30 s at 16 kHz.'
  - repo: blab-mex
    path: TransShiftMex/Audapter.cpp
    lines:
    - 1602
    - 1604
    hl:
    - 1603
    expect: size = frame_counter*p.frameLen
    note: getData returns only what was recorded since the last wrap.
  - repo: blab-mex
    path: TransShiftMex/Audapter.cpp
    lines:
    - 2285
    - 2296
    hl:
    - 2286
    - 2293
    expect: p.trialLen) ) {
    note: The trialLen mute and the onset ramp use frame_counter as the trial clock.
  - repo: blab-mex
    path: TransShiftMex/ost.cpp
    lines:
    - 371
    - 374
    hl:
    - 372
    expect: (data_counter - statOnsetIndices[stat]) * frameDur
    note: >-
      ELAPSED_TIME compares the restarted data_counter with a state onset stored before the wrap, so the difference stays negative.
  fix: >-
    Stop recording at the end of the buffer but keep a separate trial clock, and report an overflow through <code>getData</code>. At minimum, have <code>AudapterIO('getData')</code>
    warn when the returned length is shorter than the time since <code>reset</code>. Workaround: keep trials under 30 s.
verify:
- kind: H
  what: sanitizer scenario (35.2 s trial)
  name: t_mem.m SCEN=long
  detail: input 35.2 s, getData returned 5.20 s
- kind: H
  what: interface check
  name: scratch/interface/t_wrap.m
  detail: after 31 s of input, signalIn has 16000 samples (1.0 s)
- kind: H
  what: report export (OST, trialLen, heard output)
  name: report_i03.m
  detail: 35 s trial with OST, trialLen and ramps
- kind: F
  what: CBMC on the verbatim recorder index code
  name: formal/cbmc/ring.c
  detail: >-
    the related recorder overrun (I-12): the write overflows exactly when frameLen does not divide 480000 and a trial reaches about 30 s; of common sizes only frameLen
    512 is affected (others: 9, 18, 36, 45, 72, 90, 144, 180, …); 16, 32, 48, 64, 80, 96, 120, 128, 160, 192, 256 are safe (FORMAL-5)
reproduce: cd audit/harness && ./run-oct.sh report_i03.m
