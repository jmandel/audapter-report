# Full finding card LIVE-1 / LIVE-2. Sections follow the fixed template (build.py REQUIRED).
id: LIVE-1 / LIVE-2
log: LIVE-1
notes: live/README.md#live-1
headline: Reloading OST/PCF files or rebuilding DSP objects while audio runs can crash MATLAB
severity: med
reach_kind: pitfall
reach: >-
  Not triggered by blab's runners: every one stops audio before loading files or changing parameters (stop, load, reset, start), which we found race-free. Affects always-on designs that change settings while audio runs.
settings:
  source: Hypothetical always-on design, simulated on the live audio path (real audioIO and RtAudio code, simulated ASIO driver).
  override:
    params: {}
    switching: OST/PCF reloaded or parameters set every 20 or 250 ms while audio runs
    input: a looped vowel
  playground: false
  playground_why: this needs the live audio path.
origin: upstream
status:
- D
what: >-
  In always-on designs the audio keeps running while MATLAB loads a new OST or PCF, or sets parameters that rebuild the pitch shifter, phase vocoder or formant tracker.
  These operations free and reallocate memory that the audio callback is using at the same moment. The callback then reads a NULL pointer, which crashes MATLAB, or
  freed memory, which may play garbage or crash later.
scope: >-
  Affects designs that change OST, PCF, <code>pitchShiftRatio</code> with the time-domain shifter, <code>fn1</code>/<code>fn2</code>, or <code>pvocFrameLen</code>
  while audio is running, which <code>AudapterIO('init')</code> does in an always-on loop. Stopping audio before these calls avoids it. The usual per-trial start–stop
  flow is not affected. These numbers come from a simulation of the live path (the real audio code, built with GCC on Linux, with a modelled ASIO driver), so rates
  are indicative.
example: >-
  A simulated always-on session reloading the PCF every 20 or 250 ms while a vowel plays: {pcf_crashes} crashes in {pcf_reloads} reloads. Reloading the OST: {ost_crashes}
  crashes in {ost_reloads} reloads. Each run died after between {crash_min} and {crash_max} reloads.
figure_caption: >-
  Two threads on one time axis: what the MATLAB thread does to the data, and when the audio callback reads it.
table:
- - live simulation
  - PCF reloads until a crash
  - '{pcf_crashes} crashes in {pcf_reloads} reloads (about 1 in {pcf_per})'
- - live simulation
  - OST reloads until a crash
  - '{ost_crashes} crashes in {ost_reloads} reloads (about 1 in {ost_per})'
- - live simulation
  - Parameter changes read after free (AddressSanitizer)
  - pitchShiftRatio, fn1, pvocFrameLen, PCF reload with the phase vocoder
sketch: live12
asset_dir: live-1-live-2
audio: []
audio_note: 'No recordings: the effect is a crashed process or a read of freed memory.'
cause:
  summary: >-
    Nothing serialises the MATLAB thread and the audio callback. Reading a PCF frees the per-state arrays and sets them to NULL before allocating new ones, while
    <code>pertCfg.n</code> keeps the old count; the OST reader does the same with <code>stat0</code>. Several parameter setters delete and rebuild DSP objects that
    the callback may be using.
  refs:
  - repo: blab-mex
    path: TransShiftMex/pcf.cpp
    lines:
    - 332
    - 340
    hl:
    - 334
    - 335
    expect: pitchShift = NULL;
    note: PERT_CFG::readFromFile frees the arrays first...
  - repo: blab-mex
    path: TransShiftMex/pcf.cpp
    lines:
    - 421
    - 426
    hl:
    - 421
    - 423
    expect: pitchShift = (float *)calloc(n, sizeof(float))
    note: '...and allocates the new ones only after parsing the file.'
  - repo: blab-mex
    path: TransShiftMex/Audapter.cpp
    lines:
    - 1970
    - 1973
    hl:
    - 1972
    expect: pertCfg.pitchShift[stat]
    note: 'The callback reads it on every frame while n > 0: the ASan crash site.'
  - repo: blab-mex
    path: TransShiftMex/ost.cpp
    lines:
    - 140
    - 144
    hl:
    - 142
    - 143
    expect: stat0 = NULL;
    note: The OST reader frees and NULLs stat0 the same way...
  - repo: blab-mex
    path: TransShiftMex/ost.cpp
    lines:
    - 360
    - 361
    hl:
    - 361
    expect: stat >= stat0[i]
    note: '...which osTrack reads every frame: the TSan SEGV site.'
  - repo: blab-mex
    path: TransShiftMex/Audapter.cpp
    lines:
    - 1029
    - 1036
    hl:
    - 1035
    expect: bRemakeTimeDomainShifter = true;
    note: Setting pitchshiftratio always marks the time-domain shifter for rebuilding...
  - repo: blab-mex
    path: TransShiftMex/Audapter.cpp
    lines:
    - 1449
    - 1455
    hl:
    - 1451
    expect: timeDomainShifter.reset(
    note: '...and the old object is deleted while the callback may be inside it.'
  - repo: blab-mex
    path: TransShiftMex/Audapter.cpp
    lines:
    - 1426
    - 1431
    hl:
    - 1430
    expect: pVocs.clear();
    note: >-
      The same for the phase vocoders (pvocFrameLen, pvocHop, nFB); readPertCfg clears them on every PCF load (line 3205).
  - repo: blab-matlab
    path: mcode/runExperiment.m
    lines:
    - 851
    - 859
    hl:
    - 851
    - 859
    expect: AudapterIO('pcf', pcf, [], 0);
    note: 'ALWAYS_ON: both files are reloaded for every trial while audio runs.'
  fix: >-
    Refuse <code>ost</code>, <code>pcf</code> and object-rebuilding parameter changes while audio runs, or build into temporaries and swap them in under a lock the
    callback also takes. Workaround: stop audio before loading files or changing these parameters.
