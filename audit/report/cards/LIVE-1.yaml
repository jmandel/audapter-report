fidelity: >-
  Simulation, not a Windows rig: the real mexFunction, audioIO.cpp and RtAudio ASIO code, built with GCC on Linux (plain -O2, ASan, TSan), driven by a fake ASIO driver
  in docker. The race windows are real code; crash rates depend on thread scheduling, the CPU and MATLAB's per-call overhead, so they are indicative, not Windows-exact.
