# Full finding card FMT-F1. Sections follow the fixed template (build.py REQUIRED).
id: FMT-F1
log: FMT-F1
notes: notes/formant.md#f1
headline: >-
  A clamp trajectory shorter than 2048 values is read as 2048: after it ends, the formant clamp follows whatever lies next in memory
severity: med
reach_kind: robust
reach: >-
  Not triggered by blab's public code, which does no formant clamping; the settings of blab's clamping experiment were not available to us. Affects clamp trajectories shorter than 2048 values.
settings:
  source: 'Hypothetical design: a plausible design, not one blab runs; blab''s default settings (getAudapterDefaultParams) unless listed.'
origin: blab
status:
- H
what: >-
  The setters for <code>clampf1</code>/<code>clampf2</code> copy 2048 values whatever length MATLAB passes, so a shorter trajectory is followed by memory contents.
  The clamp runs on into those values until it meets a zero. The 1D-field arrays behave the same way with 257 values.
scope: >-
  Affects clamped-formant experiments whose trajectories are shorter than 2048 values; the default parameters pad to 2048 and are safe. The values read past the array
  vary from run to run and between machines, so the effect ranges from harmless to a formant pushed to 0 Hz.
example: >-
  A 100-value trajectory at 700 Hz on a vowel. Audapter copies 2048 values, {n_past} of them from past MATLAB's array. In this run the clamp followed the 100 values,
  then memory values until the first zero at element {first_zero}, and held a target of {stuck} Hz: F1 pushed to 0 Hz, and the output peaked at {short_out_max:.0f}
  times full scale, {gain_db:.0f} dB above the padded control.
figure_caption: >-
  The array MATLAB passed and the part Audapter reads; below, one trial's logged F1 target. Values past element 100 are from this run and change between runs.
table:
- - synthetic
  - Values passed / values copied
  - '{n_passed_t} / {n_read_t}'
- - synthetic
  - 'Logged F1 target: frames at 700 Hz / below 1 Hz, this run'
  - '{short_n_700} / {short_n_tiny}'
- - synthetic
  - 'Output peak: padded control / 100 values, this run'
  - '{ctl_out_max:.3f} / {short_out_max:.0f}'
- - synthetic
  - Output peak over {hist_n} runs
  - '{hist_min:.0f} to {hist_max:.0f}'
- - synthetic
  - '1D field: 10-value pertAmp, nonzero values read past element 10, this run'
  - '{pert_amp_nonzero_beyond}'
sketch: fmt_f1
asset_dir: fmt-f1
audio: []
audio_note: >-
  No recordings: the values read past the array vary between runs and machines, so any clip would be one arbitrary instance.
cause:
  summary: >-
    In set mode, <code>setGetParam</code> uses <code>maxNClampFrames</code> (2048) as the copy length for the clamp arrays whatever length MATLAB passed. The zero-fill
    of the rest is commented out. The 1D-field arrays use a fixed 257.
  refs:
  - repo: blab-mex
    path: TransShiftMex/Audapter.cpp
    lines:
    - 1154
    - 1164
    hl:
    - 1161
    - 1162
    expect: len = maxNClampFrames;
    note: The length is forced to 2048 for set and get alike; clampf2 does the same at 1172.
  - repo: blab-mex
    path: TransShiftMex/Audapter.cpp
    lines:
    - 1212
    - 1225
    hl:
    - 1214
    - 1221
    - 1222
    - 1223
    expect: '*((dtype *)ptr + i) = static_cast<dtype>(*((dtype *)value + i));'
    note: >-
      The copy loop reads len values from MATLAB's array; ASan flags line 1214. The zero-fill for clamp arrays is commented out.
  - repo: blab-mex
    path: TransShiftMex/Audapter.cpp
    lines:
    - 1814
    - 1823
    hl:
    - 1818
    expect: p.clamp_f1[clampIx+1] != 0
    note: >-
      The clamp moves on while the next value is nonzero, so it runs through the copied heap values until it meets a zero.
  - repo: blab-mex
    path: TransShiftMex/Audapter.cpp
    lines:
    - 934
    - 945
    hl:
    - 936
    - 940
    - 944
    expect: len = pfNPoints;
    note: The 1D field arrays are copied with a fixed length of 257 as well.
  fix: >-
    In set mode copy <code>min(nPars, max)</code> values and zero the rest; better, reject arrays of the wrong length. Workaround: always pad clamp trajectories to
    2048 values and field arrays to 257.
verify:
- kind: H
  what: ASan scenario
  name: t_mem.m SCEN=clamp_short
  detail: 'SUMMARY: AddressSanitizer: heap-buffer-overflow src/Audapter.cpp:1214 in Audapter::setGetParam'
- kind: H
  what: ASan scenario
  name: t_mem.m SCEN=pert_short
  detail: same line, 10-element 1D field arrays
- kind: H
  what: 'report export: values copied, clamp trajectory, logged sF1, output peak; 1D field on both builds'
  name: report_fmt_f1.m
- kind: H
  what: report export under ASan
  name: report_fmt_f1.m build-asan
  detail: READ of size 8 at Audapter.cpp:1214, 0 bytes after an 800-byte region (100 doubles)
reproduce: cd audit/harness && SCEN=clamp_short ./run-oct.sh t_mem.m build-asan
