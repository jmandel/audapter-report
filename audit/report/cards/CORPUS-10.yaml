# Full finding card CORPUS-10. Sections follow the fixed template (build.py REQUIRED).
id: CORPUS-10
log: CORPUS-10
notes: notes/corpus.md#corpus-10
headline: After a change of frameLen or nDelay in the same session, runFrame can hang forever at 100 % CPU
severity: high
origin: upstream
status:
- H
what: >-
  Changing <code>frameLen</code>, <code>nDelay</code> or <code>nWin</code> does not rebuild the formant tracker. The stale tracker can produce NaN LPC coefficients,
  and the root finder then loops forever because it has no iteration limit. In an experiment this freezes the audio callback and MATLAB.
scope: >-
  Needs a frame-setting change within one MATLAB session, for example switching between a formant and a time-domain pitch condition with different frame settings.
  It depends on the audio: of four real clips run through the same switch, one hung. A fresh session with the same settings is fine.
example: >-
  A sung phrase (vocadito_4) with the time-domain pitch shifter, one trial at <code>frameLen 32 / nDelay 5</code>, then <code>AudapterIO('init')</code> with <code>frameLen
  64 / nDelay 7</code> and the same clip again. The second trial's first <code>runFrame</code> call never returns: no frame completes in {hang_s:.0f} s at {cpu_min:.0f}–{cpu_max:.0f}
  % CPU. In a fresh session the same trial processes all {frames_fresh} frames in {t_fresh:.2f} s.
figure_caption: >-
  Progress of the second trial after the switch, against the same trial in a fresh session; both on the wall-clock time since the trial started.
table:
- - real speech
  - 'Frames completed: fresh session / after the switch'
  - '{frames_fresh} / {frames_hung}'
- - real speech
  - CPU while hung
  - '{cpu_min:.1f}–{cpu_max:.1f} %'
- - real speech
  - Time until killed
  - '{hang_s:.0f} s (240 s in an independent re-run)'
- - real speech
  - Clips that hang after the same switch
  - 1 of 4
sketch: corpus10
asset_dir: corpus-10
audio: []
audio_note: 'No recordings: nothing comes out while the process is hung.'
cause:
  summary: >-
    <code>hqr_roots</code> uses the QR iteration from Numerical Recipes without its limit of 30 iterations, so NaN coefficients make it loop forever. The NaNs come
    from the formant tracker, which <code>framelen</code>, <code>ndelay</code> and <code>nwin</code> do not mark for rebuilding (I-09).
  refs:
  - repo: blab-mex
    path: TransShiftMex/lpc_formant.cpp
    lines:
    - 427
    - 429
    hl:
    - 428
    expect: its=0;
    note: The per-root iteration counter is reset...
  - repo: blab-mex
    path: TransShiftMex/lpc_formant.cpp
    lines:
    - 476
    - 489
    hl:
    - 476
    - 489
    expect: its == 10 || its == 20
    note: >-
      ...used only for the exceptional shifts at 10 and 20, and incremented, but never checked against a maximum. Numerical Recipes returns an error at its == 30.
  - repo: blab-mex
    path: TransShiftMex/lpc_formant.cpp
    lines:
    - 956
    - 958
    hl:
    - 958
    expect: hqr_roots(lpcAi
    note: Called on every voiced frame with the coefficients from getAi, which are not checked for NaN.
  - repo: blab-mex
    path: TransShiftMex/Audapter.cpp
    lines:
    - 758
    - 767
    hl:
    - 758
    - 765
    expect: ns == string("ndelay")
    note: framelen and ndelay rebuild the phase vocoder and time-domain shifter, but not the formant tracker.
  fix: >-
    Cap the iterations and skip the frame, check the LPC coefficients with <code>isfinite</code>, and rebuild the tracker when frame settings change. Workaround:
    after changing frameLen, nDelay or nWin, change <code>nLPC</code> or <code>bCepsLift</code> in a throw-away <code>AudapterIO('init')</code> and restore it, or
    <code>clear Audapter</code>.
verify:
- kind: H
  what: hang reproduction on real speech
  name: harness/oct/corpus_tdshang.m
  detail: SCEN=vocadito_4 VARIANT=after32
- kind: H
  what: report export with timing and CPU samples
  name: harness/oct/report_corpus10.sh
  detail: kills the container after a set time without progress; the fresh-session control completes
reproduce: cd audit/harness && oct/report_corpus10.sh 60
