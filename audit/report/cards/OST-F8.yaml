# Full finding card OST-F8. Sections follow the fixed template (build.py REQUIRED).
id: OST-F8
log: OST-F8
notes: notes/ost-pcf.md#f8
headline: Written the way the manual describes, the INTENSITY_AND_RATIO OST rules have no hold time
severity: low
reach_kind: pitfall
reach: >-
  Not triggered: no blab OST we inspected uses the AND_RATIO rules. Affects OSTs written with the manual's {{}} placeholder in field 5.
settings:
  source: 'Hypothetical design: a plausible design, not one blab runs; blab''s default settings (getAudapterDefaultParams) unless listed.'
origin: blab
since: Introduced in the blab-lab fork with modes 40 and 45 (commit 9039c07).
status:
- H
- D
what: >-
  The INTENSITY_AND_RATIO_ABOVE_THRESH and _BELOW_THRESH rules (modes 40 and 45) read their hold time from the fifth field of the OST line, where the file format
  puts <code>{{}}</code>. <code>{{}}</code> reads as 0, so the rule fires on the second qualifying frame, without the intended debounce.
scope: >-
  Affects OST files that use modes 40 or 45 with <code>{{}}</code> in field 5, as the manual's format suggests. With a number in field 5 the hold works. How much
  the missing hold matters depends on the thresholds and the speaker: with the thresholds used here, the rule fired early on a synthetic fricative, but on real /sh/
  onsets it fired in only 2 of 4 sentences and the held version in none, so a lab's own thresholds decide the effect.
example: >-
  OST <code>0 INTENSITY_AND_RATIO_ABOVE_THRESH 0.01 1.5 &lt;field 5&gt;</code> on a synthetic "sa", with +10 dB in state 2. With field 5 = 0.05 the rule holds {hold_frames}
  frames and state 2 starts at {hold_state2_s:.3f} s; with <code>{{}}</code> it holds {braces_frames} frame and starts at {braces_state2_s:.3f} s. A 20 ms click before
  the word triggers state 2 at {click_braces_state2_s:.3f} s with <code>{{}}</code>; with the hold, the click is ignored.
figure_caption: >-
  One trial per setting: OST state with field 5 = 0.05 (expected) and with {{}} (observed), without and with a click before the word.
table:
- - synthetic
  - 'State 2 onset: field 5 = 0.05 / {{}}'
  - '{hold_state2_s:.3f} / {braces_state2_s:.3f} s'
- - synthetic
  - Frames held before firing
  - '{hold_frames} / {braces_frames}'
- - synthetic
  - With a 20 ms click before the word
  - '{click_hold_state2_s:.3f} / {click_braces_state2_s:.3f} s'
- - real speech
  - 'Sentences starting with /sh/ where the rule fired: hold / {{}}'
  - '{r_n_hold} of {r_n_fric} / {r_n_brace} of {r_n_fric}'
sketch: ost_f8
asset_dir: ost-f8
audio:
- file: input_click.wav
  role: input
  label: 'Input: a click, then "sa"'
- file: output_click_hold.wav
  role: expected
  label: 'Field 5 = 0.05: +10 dB from the /s/'
- file: output_click_braces.wav
  role: observed
  label: 'Field 5 = {{}}: +10 dB from the click'
- file: output_braces.wav
  role: observed
  label: 'Field 5 = {{}}, no click: +10 dB 48 ms early'
audio_note: All clips share one playback gain. 16 kHz, 16-bit, as recorded by Audapter.
real:
  dir: ost-f8
interactive:
  status: planned
  plan: >-
    type field 5 (<code>{}</code>, 0.02, 0.05, 0.1) and the click level, and see and hear when state 2 starts, on the released build and on one that rejects a non-numeric
    field 5 for modes 40 and 45 at load.
cause:
  summary: >-
    Modes 40 and 45 take their hold from field 5. To allow that, the parser no longer checks that field 5 is <code>{}</code>, and <code>atof("{}")</code> returns
    0. The verbose printout does not show the value.
  refs:
  - repo: blab-mex
    path: TransShiftMex/ost.cpp
    lines:
    - 228
    - 231
    hl:
    - 230
    expect: if (items.size() != 5)
    note: Only the field count is checked; field 5 is not required to be <code>{}</code>.
  - repo: blab-mex
    path: TransShiftMex/ost.cpp
    lines:
    - 247
    - 253
    hl:
    - 249
    expect: prm3[i0] = atof(items[4].c_str());
    note: <code>atof("{}")</code> is 0, without an error. The verbose line prints prm1 and prm2 only.
  - repo: blab-mex
    path: TransShiftMex/ost.cpp
    lines:
    - 675
    - 682
    hl:
    - 676
    - 680
    expect: minDurN = (int)floor(prm3[k] / frameDur + 0.5);
    note: >-
      The hold for mode 40 (mode 45 at line 702 is the same). With prm3 = 0 the second qualifying frame advances.
  fix: >-
    Give modes 40 and 45 an explicit parameter layout: reject a non-numeric field 5 for them at load, keep the <code>{}</code> check for other modes, document the
    hold, and print it in the verbose summary. Workaround: put the hold time in field 5.
verify:
- kind: H
  what: harness test
  name: t_ost.m
  test: 'OST F8: AND_RATIO field-4 hold (50 ms) honoured'
- kind: H
  what: report export (fricative + click, audible)
  name: report_ost_f8.m
  detail: modes 40 and 45 exist only in this version
- kind: D
  what: standalone driver of ost.cpp
  name: scratch/ost-pcf/t/drv.cpp hold
  detail: 'field 5 = 0.05: 25 frames; {}: 1 frame'
reproduce: cd audit/harness && ./run-oct.sh report_ost_f8.m
