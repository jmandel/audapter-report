  id: ost-f2
  variants:
  - shipped
  - fix-ost-f2
  patches:
    fix-ost-f2:
    - ost-f2-maxioi-onset-index.patch
  needs:
    recorder_s: 1.4
  button: Run a three-trial session on both builds
  inputs:
    vowel: dev_vowel_48k.wav
  params:
    rmsthresh: 0.005
    bdetect: 1
    btrack: 1
    bshift: 1
    bratioshift: 1
    bmelshift: 0
    f1min: 0
    f1max: 5000
    f2min: 0
    f2max: 5000
    lbk: 0
    lbb: 0
    pertf1:
      linspace:
      - 0
      - 5000
      - 257
    pertf2:
      linspace:
      - 0
      - 5000
      - 257
    pertamp:
      fill: 0
      n: 257
    pertphi:
      fill: 0
      n: 257
  text: >-
    This runs one session of three trials, with the OST loaded once, through the real Audapter C++ core compiled to WebAssembly from the pinned commit: once with
    the current code and once with the one-line fix below.
cause:
  summary: >-
    When a maxIOI rule fires, the loop that should record the onset of each state it jumps over writes <code>statOnsetIndices[stat]</code>, the state being left,
    instead of <code>statOnsetIndices[j]</code>. ELAPSED_TIME in the new state then measures from a stale onset and fires at once. State 0's onset is overwritten
    with the timeout frame and never cleared, so the next trial's timeout is measured from it.
  refs:
  - repo: blab-mex
    path: TransShiftMex/ost.cpp
    lines:
    - 723
    - 733
    hl:
    - 728
    expect: statOnsetIndices[stat] = frame_counter;
    note: The loop runs over the target states j, but writes index stat every time.
  - repo: blab-mex
    path: TransShiftMex/ost.cpp
    lines:
    - 371
    - 375
    hl:
    - 372
    expect: (data_counter - statOnsetIndices[stat]) * frameDur > prm1[k]
    note: ELAPSED_TIME measures from the current state's recorded onset, which the jump never set.
  - repo: blab-mex
    path: TransShiftMex/ost.cpp
    lines:
    - 256
    - 256
    hl:
    - 256
    expect: calloc(n * maxStatesPerLine
    note: The onset table is zeroed only when the OST is loaded.
  fix: >-
    Write <code>statOnsetIndices[j]</code> in the maxIOI loop (<code>report/patches/ost-f2-maxioi-onset-index.patch</code>, one line). Together with the OST-F1 fix
    this is proven sufficient. The OST-F1 fix alone removes the growing delay but not the one-frame ELAPSED_TIME. Workaround: reload the OST before every trial, and
    avoid ELAPSED_TIME directly after a maxIOI target.
verify:
- kind: H
  what: harness test
  name: t_ost.m
  test: 'OST F2: maxIOI trial 1 ELAPSED 0.1 s in state 2'
- kind: H
  what: harness test
  name: t_ost.m
  test: 'OST F2: no-reload trial 2 timeout at 0.2 s'
- kind: H
  what: harness test
  name: t_ost.m
  test: 'OST F2: no-reload trial 3 timeout at 0.2 s'
- kind: H
  what: report export (vowel, audible)
  name: report_ost_f2.m
  detail: vowel input, so the effect is audible
- kind: H
  what: WASM patch check
  name: report/wasm/checks/fix-ost-f2.mjs
  detail: fix-ost-f2 removes both symptoms; a configuration without maxIOI stays bit-identical
- kind: D
  what: standalone driver of ost.cpp
  name: scratch/ost-pcf/t/drv.cpp maxioi_onset, maxioi_trials
  detail: state 2 entered at frame 101, left at 102; timeouts at frames 101, 202, 303
- kind: F
  what: Lean 4 proof, theorem trial_independent
  name: formal/lean/Ost.lean
  detail: with both fixes, trials no longer depend on earlier trials; clearing statOnsetIndices is not needed
- kind: F
  what: Lean 4 counterexamples
  name: formal/lean/OstCex.lean
  detail: >-
    the reset fix alone leaves the one-frame ELAPSED_TIME; the [j] fix alone leaves OST-F1 (ce2_bug_trial1, ce2_bug_drift, ce1_leak)
reproduce: cd audit/harness && ./run-oct.sh t_ost.m
