# Full finding card OST-F2. Sections follow the fixed template (build.py REQUIRED).
id: OST-F2
log: OST-F2
notes: notes/ost-pcf.md#f2
headline: >-
  After an OST maxIOI timeout, the next ELAPSED_TIME lasts one frame, and without reloading the OST the timeout fires 0.2 s later in every trial
severity: med
reach_kind: pitfall
reach: >-
  Not triggered: no blab OST we inspected has a maxIOI (timeout) section. Affects OSTs with a timeout that are loaded once for many trials.
settings:
  source: 'Hypothetical design: a plausible design, not one blab runs; blab''s default settings (getAudapterDefaultParams) unless listed.'
origin: upstream
status:
- H
- D
- F
what: >-
  When a maxIOI rule moves the OST to a later state, Audapter records the time of that jump against the wrong state. An ELAPSED_TIME rule in the new state then fires
  on the next frame instead of after its duration. The wrong record also shifts the reference that later timeouts are measured from, so if the OST is not reloaded
  between trials, each trial's timeout fires later than the one before.
scope: >-
  Affects OST files with a maxIOI section, on trials where the timeout actually fires, typically quiet or unusual productions where onset detection fails. The one-frame
  ELAPSED_TIME happens on every such trial. The growing delay happens only when the OST is loaded once and several trials run with <code>reset()</code> between them;
  reloading the OST before each trial removes the delay but not the one-frame ELAPSED_TIME.
example: >-
  OST <code>0 INTENSITY_RISE_HOLD 0.02 0.02</code> → <code>2 ELAPSED_TIME 0.1</code> → <code>3 OST_END</code>, with the maxIOI rule <code>0 0.2 2</code> and F1 raised
  30 % in state 3. A soft vowel never reaches the onset threshold, so the timeout should start the sequence at {ctrl_state2_s:.2f} s and the shift should start at
  {ctrl_shift_on_s:.2f} s in every trial. With the OST loaded once, state 2 lasts {held1_ms:.0f} ms, and the timeout fires at {s2_1:.2f}, {s2_2:.2f} and {s2_3:.2f}
  s into trials 1, 2 and 3.
figure_caption: >-
  One session with three trials laid end to end, the OST loaded once. Dashed lines mark the intended timeout in each trial. The lower rows show the intended timing.
table:
- - synthetic
  - Timeout, trials 1 / 2 / 3, OST loaded once
  - '{s2_1:.2f} / {s2_2:.2f} / {s2_3:.2f} s (intended {ctrl_state2_s:.2f} s)'
- - synthetic
  - Time in state 2 (ELAPSED_TIME 0.1 s)
  - '{held1_ms:.0f} ms in every trial'
- - synthetic
  - Timeout with the OST reloaded before the trial
  - '{reload_state2_s:.2f} s; state 2 still lasts 2 ms'
- - synthetic
  - F1 at 0.22–0.28 s, trial 1 vs intended
  - '{F1_t1_early_hz:.0f} vs {F1_ctrl_early_hz:.0f} Hz'
- - real speech
  - Timeout, trials 1–{r_n_tr}, five quiet speakers, OST loaded once
  - '{r_nr_list} s'
- - real speech
  - Timeout with the OST reloaded
  - '{r_rl_s:.3f} s in every trial'
