# Full finding card OST-F2. Rendered by build.py; see PLAN.md section 3 for the fields.
id: OST-F2
log: OST-F2
notes: "notes/ost-pcf.md#f2"
headline: "After a maxIOI timeout, an ELAPSED_TIME of 0.1 s lasts 2 ms, and without an OST reload the timeout moves 0.2 s later every trial"
severity: high
origin: upstream
origin_note: "Present unchanged in upstream 2.1.5: the same export script on build-upstream gives identical onsets in every trial."
status: [H, D]
effect:
  setup: >
    OST: <code>0 INTENSITY_RISE_HOLD 0.02 0.02</code> → <code>2 ELAPSED_TIME 0.1</code> → <code>3 OST_END</code>, with the maxIOI
    rule <code>0 0.2 2</code> (if no onset is detected within 0.2 s, jump to state 2). PCF: F1 +30 % in state 3 only, i.e. from 0.1 s
    after the fallback onset. Input: a soft sustained /a/ whose smoothed RMS stays below the 0.02 onset
    threshold (but above <code>rmsThresh</code>, so formants are tracked and shifted), so the maxIOI fallback has to start the sequence. The OST and PCF were loaded once and three trials were run with
    <code>Audapter('reset')</code> between them, as in an experiment loop. The intended timing comes from a control run with the same
    timing written as two ELAPSED_TIME rules.
  expected: "In every trial, state 2 begins at the timeout ({ctrl_state2_s:.3f} s), state 3 begins {held_ctrl_ms:.0f} ms later, and F1 is raised from {ctrl_shift_on_s:.3f} s."
  observed: >
    Trial 1: the timeout fires on time ({s2_1:.3f} s), but ELAPSED_TIME ends state 2 after {held1_ms:.0f} ms, so F1 is raised from {on_1:.3f} s,
    {early:.2f} s early. In the 0.22–0.28 s window the output F1 is {F1_t1_early_hz:.0f} Hz, against {F1_ctrl_early_hz:.0f} Hz in the control.
    Without an OST reload the timeout itself then drifts: state 2 begins at {s2_2:.3f} s in trial 2 and {s2_3:.3f} s in trial 3, so the shift
    starts {late2:.2f} s and {late3:.2f} s late. In trial 3, F1 at 0.42–0.58 s is still {F1_t3_mid_hz:.0f} Hz, against {F1_ctrl_mid_hz:.0f} Hz in the control.
    Reloading the OST before a trial restores the timeout ({reload_state2_s:.3f} s) but not ELAPSED_TIME (state 3 at {reload_state3_s:.3f} s).
  matters: >
    The maxIOI rule is the safety net for trials where onset detection fails, typically quiet or unusual productions. On exactly those trials,
    any timing measured from the state the fallback jumps to (an ELAPSED_TIME, a time-warp atom anchored on it, or a later maxIOI rule) starts
    from a stale onset. If the lab does not reload the OST before each trial, every timeout also moves the reference for state 0, so later
    fallbacks fire later and later within a session. <code>ost_stat</code> logs the states as they happened, so the data are consistent with
    what was played, but they do not match the OST file.
  numbers:
    - ["State 2 onset (timeout), intended", "{ctrl_state2_s:.3f} s"]
    - ["State 2 onset, trials 1 / 2 / 3 (OST loaded once)", "{s2_1:.3f} / {s2_2:.3f} / {s2_3:.3f} s"]
    - ["Time in state 2 (ELAPSED_TIME {elapsed_s:g} s): intended / trials 1–3", "{held_ctrl_ms:.0f} / {held_ms[0]:.0f}, {held_ms[1]:.0f}, {held_ms[2]:.0f} ms"]
    - ["F1 +30 % onset: intended / trials 1 / 2 / 3", "{ctrl_shift_on_s:.3f} / {on_1:.3f} / {on_2:.3f} / {on_3:.3f} s"]
    - ["State 2 / state 3 onset with the OST reloaded before the trial", "{reload_state2_s:.3f} / {reload_state3_s:.3f} s"]
    - ["F1 heard (independent LPC), 0.22–0.28 s: input / control / trial 1", "{F1_in_hz:.0f} / {F1_ctrl_early_hz:.0f} / {F1_t1_early_hz:.0f} Hz"]
