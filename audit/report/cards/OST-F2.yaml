cause:
  summary: >
    When a maxIOI rule fires, the loop meant to record the onset frame of every state it jumps over, including the target, writes
    <code>statOnsetIndices[stat]</code> (the state being left) instead of <code>statOnsetIndices[j]</code>. The target state's onset
    keeps whatever was there: 0 from the load-time <code>calloc</code>, or a value from an earlier trial. ELAPSED_TIME measures from that onset,
    so it fires at once. Meanwhile state 0's onset is overwritten with the timeout frame. Nothing else writes index 0 and nothing clears the
    table between trials, so in the next trial the timeout is measured from the previous trial's timeout frame.
  refs:
    - {repo: blab-mex, path: TransShiftMex/ost.cpp, lines: [723, 733], hl: [728], expect: "statOnsetIndices[stat] = frame_counter;", note: "The loop runs over the target states j, but writes index stat every time."}
    - {repo: blab-mex, path: TransShiftMex/ost.cpp, lines: [371, 375], hl: [372], expect: "(data_counter - statOnsetIndices[stat]) * frameDur > prm1[k]", note: "ELAPSED_TIME measures from the current state's recorded onset, which the jump never set."}
    - {repo: blab-mex, path: TransShiftMex/ost.cpp, lines: [256, 256], hl: [256], expect: "calloc(n * maxStatesPerLine", note: "The onset table is zeroed only when the OST is loaded; <code>OST_TAB::reset()</code> does not clear it (and is never called, see OST-F1)."}
  upstream_refs:
    - {repo: upstream-mex, path: TransShiftMex/ost.cpp, lines: [552, 555], expect: "statOnsetIndices[stat] = frame_counter"}
    - {repo: upstream-mex, path: TransShiftMex/ost.cpp, lines: [356, 357], expect: "ELAPSED_TIME"}
  fix: "Write <code>statOnsetIndices[j]</code> in the maxIOI loop (report/patches/ost-f2-maxioi-onset-index.patch, one line). Clearing the table in <code>OST_TAB::reset()</code> and calling it per trial (OST-F1) is also worth doing, as a second line of defence."
