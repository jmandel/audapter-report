  - {kind: H, what: "harness test", name: "t_ost.m", test: "OST F2: no-reload trial 2 timeout at 0.2 s"}
  - {kind: H, what: "harness test", name: "t_ost.m", test: "OST F2: no-reload trial 3 timeout at 0.2 s"}
  - {kind: H, what: "report export (vowel, audible)", name: "report_ost_f2.m", detail: "blab and upstream builds give identical onsets"}
  - {kind: H, what: "WASM patch check", name: "report/wasm/checks/fix-ost-f2.mjs", detail: "shipped vs fix-ost-f2 (and fix-ost-f1 for comparison); regression case without maxIOI must stay bit-identical"}
  - {kind: D, what: "standalone driver of ost.cpp", name: "scratch/ost-pcf/t/drv.cpp maxioi_onset, maxioi_trials", detail: "state 2 entered at frame 101, left at 102; timeouts at frames 101, 202, 303"}
  - {kind: F, what: "formal analysis", name: "pending (audit/formal/)", pending: true}
