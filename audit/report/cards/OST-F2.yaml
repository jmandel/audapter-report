           lbk: 0, lbb: 0, pertf1: {linspace: [0, 5000, 257]}, pertf2: {linspace: [0, 5000, 257]}, pertamp: {fill: 0, n: 257}, pertphi: {fill: 0, n: 257}}
  text: >
    This runs the control and then three trials on one Audapter instance, with the OST and PCF loaded once and only a reset between
    trials, through the real C++ core compiled to WebAssembly from the pinned commit, once as released and once with the one-line fix below.
    The one-line fix alone clears both symptoms: the jump no longer writes state 0's onset, so there is nothing to drift. The separate
