# Full finding card OST-F4. Sections follow the fixed template (build.py REQUIRED).
id: OST-F4
log: OST-F4
notes: notes/ost-pcf.md#f4
headline: >-
  A PCF with fewer rows than the OST has states makes Audapter read past its arrays, and memory contents decide whether formants are shifted
severity: med
reach_kind: robust
reach: >-
  Not triggered: blab's PCFs have one row per OST state. Affects any PCF with fewer rows than the OST has states.
settings:
  source: 'Hypothetical design: a plausible design, not one blab runs; blab''s default settings (getAudapterDefaultParams) unless listed.'
origin: upstream
status:
- H
- D
what: >-
  The formant path indexes the PCF's amplitude and phase arrays with the current OST state without checking the PCF's length. In OST states beyond the PCF's last
  row, it reads whatever lies after the arrays in memory, and that value decides whether and how much to shift.
scope: >-
  Affects OST/PCF pairs where the PCF has fewer rows than the OST has states, which the file format allows and the loader does not check, for example a PCF written
  only up to the last perturbed state. Pitch and intensity shifts check the length and are not affected. What happens depends on memory contents, which differ between
  machines and sessions.
example: >-
  An OST with states 0–4 and a 3-row PCF that raises F1 in state 2. From {state3_s:.2f} s, in states 3 and 4, every frame ({oob_frames} of {frames}) reads past the
  12-byte arrays; AddressSanitizer stops at the first read. In this Linux run the bytes read were zero, so no extra frames were shifted; on another machine they need
  not be.
figure_caption: >-
  The array Audapter allocated and the entries it reads; below, one trial's OST states and which frames read out of bounds.
table:
- - synthetic
  - Frames reading past the arrays
  - '{oob_frames} of {frames} ({oob_pct:.0f} %), from {state3_s:.2f} s'
- - synthetic
  - Allocated / largest index read
  - '{alloc_bytes} bytes (3 entries) / state {last_state}'
- - synthetic
  - Shifted frames outside state 2, this run
  - '{shift_frames_oob}'
sketch: ost_f4
asset_dir: ost-f4
audio: []
audio_note: 'No recordings: the effect depends on memory contents, so any clip would be one arbitrary instance.'
cause:
  summary: >-
    <code>PERT_CFG::readFromFile</code> allocates one entry per PCF row. <code>handleBuffer</code> indexes the formant arrays with the OST state and checks only that
    the PCF is not empty.
  refs:
  - repo: blab-mex
    path: TransShiftMex/Audapter.cpp
    lines:
    - 1806
    - 1812
    hl:
    - 1811
    expect: during_trans = (pertCfg.fmtPertAmp[stat] != 0);
    note: Runs on every frame with <code>bShift</code> on; this is the line AddressSanitizer reports.
  - repo: blab-mex
    path: TransShiftMex/Audapter.cpp
    lines:
    - 1840
    - 1843
    hl:
    - 1841
    - 1842
    expect: mamp = pertCfg.fmtPertAmp[stat];
    note: When the value read is nonzero, amplitude and phase are read out of bounds as well.
  - repo: blab-mex
    path: TransShiftMex/Audapter.cpp
    lines:
    - 1970
    - 1974
    hl:
    - 1971
    expect: if (stat < pertCfg.n) {
    note: 'For comparison: the pitch/intensity path has the bounds check.'
  - repo: blab-mex
    path: TransShiftMex/pcf.cpp
    lines:
    - 431
    - 438
    hl:
    - 431
    - 435
    expect: fmtPertAmp = (float *)calloc(n, sizeof(float))
    note: Sized by the PCF row count only.
  fix: >-
    Check <code>stat &lt; pertCfg.n</code> in the formant path, as the pitch path does, and reject at load a PCF with fewer rows than the OST has states. Workaround:
    always write one PCF row per OST state.
verify:
- kind: H
  what: sanitizer scenario (build-asan)
  name: t_mem.m SCEN=pcf_short
  detail: >-
    heap-buffer-overflow READ at Audapter.cpp:1811, 0 bytes after an 8-byte region allocated at pcf.cpp:431
- kind: H
  what: report export (ASan run + timeline)
  name: report_ost_f4.m
  detail: run under build-asan first (log to out/report/ost-f4/asan.log), then on build-oct
- kind: D
  what: standalone driver of pcf.cpp
  name: scratch/ost-pcf/t/drvp.cpp oob
  detail: 'PCF n = 5: fmtPertAmp[6] = 4.6e-44 (during_trans = 1), fmtPertPhi[8] = 4.3e18'
reproduce: cd audit/harness && SCEN=pcf_short ./run-oct.sh t_mem.m build-asan
