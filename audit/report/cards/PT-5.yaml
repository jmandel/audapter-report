# Full finding card PT-5. Sections follow the fixed template (build.py REQUIRED).
id: PT-5
log: PT-5
notes: notes/pitch-time.md#pt-5
headline: >-
  With the phase vocoder on, the voice is played up to 6 dB louder, depending on whether a time-warp section is loaded, so mixing
  warp and no-warp trials gives a loudness cue
severity: high
origin: upstream
status: [H, D, F]
reach_kind: current
reach: >-
  Touches blab's time-warp experiments, whose settings turn the vocoder on (timeAdapt, timeWrap). blab's timeWrap keeps a
  zero-length warp row on its control trials, so its trials all play at the same, correct level. Any design that drops the warp
  section on some trials, or runs the vocoder without a warp section, is affected.
what: >-
  With <code>bPitchShift = 1</code> the phase vocoder processes the voice even at 0 semitones. Without a time-warp section in the
  PCF, it plays the voice louder than it came in: +3.5 dB at the default 16 kHz / frameLen 32, and +6.0 dB at the 24 kHz / frameLen 48
  settings blab uses for time warping. With a warp section loaded, even a zero-length one, the vocoder runs in its warp mode for the
  whole trial, at a different level: 0.0 dB at 24 kHz / frameLen 48, −2.5 dB at 16 kHz / frameLen 32. When a pitch shift starts,
  the level changes again, by an amount that depends on F0 and vowel.
scope: >-
  Matters when trials or phases differ in whether a warp section is loaded (a loudness cue that tells the participant which trials
  are perturbed), when the vocoder is on in some phases and off in others (for example a calibration at <code>bPitchShift = 0</code>),
  and for pitch-shift onsets. <strong>Safe if</strong> every trial carries a warp section (a zero-length row on control trials), as in
  blab's timeWrap experiment.
example: >-
  A time-warp experiment with blab's timeAdapt settings (24 kHz, frameLen 48, vocoder on): perturbed trials slow the speech down
  and catch up, control trials do not. If control trials keep a zero-length warp row, both kinds play at the spoken level
  (control {exp_t1_txt}, warp {exp_t2_txt}). If control trials drop the warp section, they play at {obs_t1_txt}: {cue_db:.1f} dB
  louder than the warp trials around them.
settings:
  source: "blab's timeAdapt settings (free-speech run_measureDuration_audapter.m: 24 kHz, downFact 2, frameLen 48, bPitchShift 1 \"needed if time warping is used\"); the warp timing here is illustrative. blab's timeWrap experiment keeps a zero-length warp row on control trials (the expected panel). fb 1 so the speech level can be measured without the babble."
  key_params: [sr, downFact, frameLen, bPitchShift, fb]
figure_caption: >-
  One session of four trials. Expected: control trials keep a zero-length warp row. Observed: control trials drop the warp
  section. Values are the output level measured on the audio, relative to the spoken input.
table:
- [timeAdapt settings, 'Level, control trial without a warp section', '{obs_t1_txt}']
- [timeAdapt settings, 'Level, control trial with a zero-length warp row / warp trial', '{exp_t1_txt} / {exp_t2_txt}']
- [timeAdapt settings, 'Loudness cue, no-warp control vs warp trial', '{cue_db:.1f} dB']
- [blab defaults, 'Level with no warp section / zero-length row / warp (16 kHz, frameLen 32)', '{w16_none:+.1f} / {w16_zero:+.1f} / {w16_warp:+.1f} dB']
- [pitch onset, 'Level change 0 → +2 st, synthetic, F0 100–260 Hz, /a/ and /i/', '{sweep_min:.1f} to {sweep_max:.1f} dB quieter']
- [real speech, 'Level at 0 st, no warp section, {r_n_clean} clips (16 kHz)', '{r_g0_lo:+.2f} to {r_g0_hi:+.2f} dB']
- [real speech, 'Loudness step at a mid-utterance pitch onset, {r_n_utt} clips', '{r_on_lo:.1f} to {r_on_hi:.1f} dB (median {r_on_med:.1f} dB)']
