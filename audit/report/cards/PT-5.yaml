  - {file: input_vowel.wav, role: input}
  - {file: output_bypass.wav, role: expected}
  - {file: output_pitch_step.wav, role: observed}
cause:
  summary: >
    Analysis and synthesis both use a Hann window with hop = L/4. Overlap-adding Hann² at that hop sums to 1.5, and the synthesis scaling
    does not divide this out, so the output is 1.5 × the input (+3.52 dB) even at ratio 1. With a shift, each bin is mapped and resynthesised
    with fresh phase (<code>sumPhase</code> starts at 0 for every bin), so the level then depends on the signal's harmonics and on the moment the
    shift begins. The normalisation option is registered under a misspelt name, so the setter never matches it.
  refs:
    - {repo: blab-mex, path: TransShiftMex/phase_vocoder.cpp, lines: [218, 220], hl: [219], expect: "X_magn[i] = 2.0", note: "Analysis magnitude."}
    - {repo: blab-mex, path: TransShiftMex/phase_vocoder.cpp, lines: [465, 467], hl: [467], expect: "osamp / 2.0", note: "Synthesis scaling: 2·w/(osamp/2) with osamp = 4 leaves the Hann² overlap sum of 1.5 in the output."}
    - {repo: blab-mex, path: TransShiftMex/Audapter.cpp, lines: [138, 138], hl: [138], expect: "bpvocmpnorm", note: "Registered as \"bpvocmpnorm\" (missing a)..."}
    - {repo: blab-mex, path: TransShiftMex/Audapter.cpp, lines: [877, 878], hl: [877], expect: "bpvocampnorm", note: "...but the setter matches \"bpvocampnorm\", so both spellings are rejected."}
    - {repo: blab-mex, path: TransShiftMex/Audapter.cpp, lines: [2152, 2154], hl: [2153], expect: "ms_out / ms_in", note: "If the name is corrected, this divides by <code>ms_in</code>, a local set to 0 at line 1978 and never updated. In our test build the output became NaN."}
  upstream_refs:
    - {repo: upstream-mex, path: TransShiftMex/phase_vocoder.cpp, lines: [467, 467], expect: "osamp / 2.0"}
    - {repo: upstream-mex, path: TransShiftMex/Audapter.cpp, lines: [137, 137], expect: "bpvocmpnorm"}
  fix: >
    Divide the overlap-add by the Hann² sum (1.5 at hop = L/4) in pitch-shift mode, as in the patch the panel runs
    (<code>report/patches/pt-5-ola-normalise.patch</code>). It gives unity gain at 0 st and leaves the time-warp modes bit-identical,
    but it does not remove the level change at the shift onset, which comes from the resynthesis. That needs a level
    match after a shift (a running RMS ratio, which is what <code>bPvocAmpNorm</code> was meant to do). Correcting only the
    parameter's registered name is not safe: in a local build with just that change, turning it on turns the output into NaN from the
    first phase-vocoder frames on, because <code>ms_in</code> (Audapter.cpp:1978) is never computed. Add a level assertion to the pitch-shift tests.
verify:
  - {kind: H, what: "harness test", name: "t_pitch.m", test: "pvoc: unity gain at 0 st"}
  - {kind: H, what: "harness test", name: "t_pitch.m", test: "pvoc: no loudness step 0 -> +2 st"}
  - {kind: H, what: "report export + F0/vowel sweep", name: "report_pt5.m"}
  - {kind: D, what: "standalone pvoc driver", name: "scratch/pitch-time/pv_test.cpp", detail: "gain 1.500 at 0 st on pure tones"}
  - {kind: F, what: "formal analysis", name: "pending (audit/formal/)", pending: true}
reproduce: "cd audit/harness && ./run-oct.sh t_pitch.m"
