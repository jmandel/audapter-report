interactive:
  id: pt-5
  variants:
  - shipped
  - fix-pt-5
  patches:
    fix-pt-5:
    - pt-5-ola-normalise.patch
  needs:
    recorder_s: 1.4
  button: Run the pitch step on both builds
  inputs:
    vowel: dev_vowel_48k.wav
  params:
    rmsthresh: 0.005
    bdetect: 1
    btrack: 1
    bpitchshift: 1
    pitchshiftratio: 1
  text: >-
    The pitch-onset part of this finding: a sustained /a/ at 120 Hz whose PCF steps from 0 to +2 semitones at 0.6 s (16 kHz defaults). This runs that trial through the real Audapter C++ core compiled to WebAssembly from the pinned commit, once as released and
    once with the overlap-add normalised. Pick the size of the step. Each trace is the output level in 20 ms blocks relative to the same input run with <code>bPitchShift
    = 0</code>, so 0 dB is the level a participant should hear.
cause:
  summary: >-
    Analysis and synthesis both use a Hann window with a hop of a quarter frame. Overlap-adding the squared window sums to 1.5, and the synthesis scaling does not
    divide this out, so the output is 1.5 times the input at any shift ratio (2 times at frameLen 48, measured; we have not located the extra factor in the code, EXP-11).
    Once a PCF has a warp section, the vocoder runs in its time-warp mode for the whole trial, and that mode has a different gain (measured, COORD-4). With a shift, each frequency bin is resynthesised with fresh phase, so the level then
    depends on the signal. The normalisation switch is registered under a misspelt name, and its code divides by a quantity that is always zero.
  refs:
  - repo: blab-mex
    path: TransShiftMex/phase_vocoder.cpp
    lines:
    - 218
    - 220
    hl:
    - 219
    expect: X_magn[i] = 2.0
    note: Analysis magnitude.
  - repo: blab-mex
    path: TransShiftMex/phase_vocoder.cpp
    lines:
    - 465
    - 467
    hl:
    - 467
    expect: osamp / 2.0
    note: 'Synthesis scaling: 2·w/(osamp/2) with osamp = 4 leaves the Hann² overlap sum of 1.5 in the output.'
  - repo: blab-mex
    path: TransShiftMex/Audapter.cpp
    lines:
    - 138
    - 138
    hl:
    - 138
    expect: bpvocmpnorm
    note: Registered as "bpvocmpnorm" (missing a)...
  - repo: blab-mex
    path: TransShiftMex/Audapter.cpp
    lines:
    - 877
    - 878
    hl:
    - 877
    expect: bpvocampnorm
    note: '...but the setter matches "bpvocampnorm", so both spellings are rejected.'
  - repo: blab-mex
    path: TransShiftMex/Audapter.cpp
    lines:
    - 2152
    - 2154
    hl:
    - 2153
    expect: ms_out / ms_in
    note: >-
      If the name is corrected, this divides by <code>ms_in</code>, a local set to 0 at line 1978 and never updated. In our test build the output became NaN.
  fix_label: Safe pattern and fix
  fix: >-
    <strong>Safe pattern:</strong> in a warp design, give every trial a warp section, a zero-length one on control trials, as blab's
    timeWrap experiment does; then all trials play at the same level. Calibrate loudness with the vocoder in the mode the experiment
    uses, not with <code>bPitchShift = 0</code>. <strong>Fix:</strong> divide the pitch-shift overlap-add by its actual window sum.
    <code>report/patches/pt-5-ola-normalise.patch</code> divides by 1.5, which gives unity gain at frameLen 32 and 64; at frameLen 48
    the sum is 2, and the patch leaves +2.5 dB (checked in the browser build). A shift still changes the level, which needs a running
    level match. Fixing only the parameter name is not safe (the code then outputs NaN).
verify:
- kind: H
  what: harness test
  name: t_pitch.m
  test: 'pvoc: unity gain at 0 st'
- kind: H
  what: harness test
  name: t_pitch.m
  test: 'pvoc: no loudness step 0 -> +2 st'
- kind: H
  what: report export + F0/vowel sweep
  name: report_pt5.m
- kind: D
  what: standalone pvoc driver
  name: scratch/pitch-time/pv_test.cpp
  detail: gain 1.500 at 0 st on pure tones
- kind: F
  what: exact algebra on the Hann window
  name: formal/ola/ola_exact.py
  detail: >-
    the 0 st overlap-add gain is exactly 3/2 (+3.52 dB) for every hop ratio pvocFrameLen/pvocHop of 3 or more, independent of frame length, hop and sample rate; the
    unity fix is a factor 2/3 at phase_vocoder.cpp:467 (FORMAL-7)
- kind: F
  what: the real phase_vocoder.cpp, measured
  name: formal/ola/pv_gain.cpp
  detail: >-
    1.5000 at hop ratios 4 and 8; content below the first bin gets 5/2; at hop ratio 2 the gain swings between 1 and 2 at the hop rate
reproduce: cd audit/harness && ./run-oct.sh t_pitch.m
