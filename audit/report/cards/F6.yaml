# Full finding card F6. Sections follow the fixed template (build.py REQUIRED).
id: F6
log: F6
notes: notes/formant.md#f6
headline: >-
  An undocumented blab change that vsaSentence depends on: a field perturbation switches on again every time the formants re-enter
  the field (and minVowelLen has no effect)
severity: med
reach_kind: current
reach: >-
  Touches blab's current experiments: vsaSentence depends on this behaviour, and the other VSA experiments use the same restricted field. It is an undocumented behaviour change, not a defect for blab; it matters for anyone running these designs on Audapter 2.1.5 or another fork.
settings:
  source: 'Hypothetical field: a restricted field that raises F1 20 % above 600 Hz, standing in for vsaSentence''s restricted 2-D centralisation field (the same re-entry rule applies to both).'
origin: blab-intended
since: >-
  Introduced deliberately in the blab-lab fork (commit deab341, "Formant dropout fix v1", 2020), so that a brief tracker excursion out of the field no longer ends
  the perturbation for the rest of the trial.
status:
- H
what: >-
  This is a question about documentation, not a defect: blab changed the rule deliberately (the "formant dropout fix", 2020), and
  vsaSentence's sentence design needs it, because its field excludes consonants, so with the original one-shot rule only the first
  vowel of each sentence would be perturbed. In perturbation-field mode, Audapter perturbs every stretch of speech whose formants fall inside the field, each time they enter it, for the whole trial. The parameter
  <code>minVowelLen</code>, which looks like it controls how long a stretch must be, has no effect and cannot even be changed.
scope: >-
  Affects field-mode experiments without an OST/PCF. On multi-syllable stimuli, diphthongs and glides, later syllables and returns to the target vowel are perturbed
  too, not only the first vowel. A brief tracker excursion out of the field does not end the perturbation. With a PCF loaded, the PCF decides per OST state and this
  does not apply. Across 80 real recordings this roughly doubles the perturbed frames compared with perturbing one stretch per trial.
example: >-
  A field that raises F1 by 20 % while F1 is at least 600 Hz. On a 1 s /a/ → /i/ → /a/ glide, F1 leaves the field and comes back: Audapter shifts both /a/ stretches
  ({glide_text}), so the final /a/ is heard at {glide_last_a_F1_out_hz:.0f} Hz instead of the spoken {glide_last_a_F1_in_hz:.0f} Hz. A one-shot rule would shift only
  the first ({up_glide_text}). On a steady /a/ with a brief F1 dip, the shift resumes after the dip.
figure_caption: >-
  One trial per input and rule: when the shift is applied with the current behaviour (observed) and with a one-shot rule (for comparison).
table:
- - synthetic
  - 'Shifted stretches on the glide: current / one-shot'
  - '{glide_text} / {up_glide_text}'
- - synthetic
  - 'Shifted stretches on /a/ with a dip: current / one-shot'
  - '{dip_text} / {up_dip_text}'
- - synthetic
  - 'F1 heard in the final /a/: spoken / current / one-shot'
  - '{glide_last_a_F1_in_hz:.0f} / {glide_last_a_F1_out_hz:.0f} / {up_last_a_out:.0f} Hz'
- - synthetic
  - minVowelLen set to {mvl_text} frames
  - '{mvl_same}'
- - real speech
  - 'Perturbed frames over {r_n} clips: current / one-shot'
  - '{r_fr_blab} / {r_fr_up}'
- - real speech
  - Clips where the two rules differ
  - '{r_n_diff} of {r_n}'
