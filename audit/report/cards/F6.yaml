cause:
  summary: >-
    In field mode, <code>detectTrans()</code> decides each voiced frame whether the formants are in the field. The rule that ended the perturbation when the formants
    left the field after at least <code>minVowelLen</code> frames (setting <code>transDone</code>, which disables detection until the next <code>reset()</code>) is
    commented out, so <code>transDone</code> is never set; its <code>else</code> branch can no longer run, and <code>minVowelLen</code> is read nowhere. Separately,
    <code>minvowellen</code> is registered as an int parameter but stored in a double, so setting it writes 4 bytes into the double and the value stays at 60 frames
    whatever is set (our sweep: identical output for 5, 60 and 1000).
  refs:
  - repo: blab-mex
    path: TransShiftMex/Audapter.cpp
    lines:
    - 2399
    - 2420
    hl:
    - 2409
    - 2410
    - 2411
    - 2418
    expect: CWN removed for dropouts
    note: >-
      detectTrans(): the end-of-stretch rule is commented out, so transDone stays false and the else branch at 2415–2419 is unreachable.
  - repo: blab-mex
    path: TransShiftMex/Audapter.cpp
    lines:
    - 1806
    - 1812
    hl:
    - 1811
    expect: during_trans = (pertCfg.fmtPertAmp[stat] != 0);
    note: With a PCF loaded, the PCF overrides detectTrans(), so only PCF-less field mode is affected.
  - repo: blab-mex
    path: TransShiftMex/Audapter.cpp
    lines:
    - 152
    - 152
    hl:
    - 152
    expect: addIntParam("minvowellen"
    note: Registered as an int...
  - repo: blab-mex
    path: TransShiftMex/Audapter.h
    lines:
    - 469
    - 469
    hl:
    - 469
    expect: dtype minVowelLen
    note: >-
      ...stored as a double. The int setter (Audapter.cpp:1196–1197) writes only the low 4 bytes, and getParam reads them back, so the value looks set.
  fix_label: Options
  fix: >-
    Choose and document one rule. If re-arming is intended, remove <code>transDone</code>, <code>minVowelLen</code> and the dead branch. If one stretch per trial
    is wanted, <code>report/patches/f6-restore-transdone.patch</code> restores it (4 lines); a parameter could offer both. Either way, store <code>minVowelLen</code>
    in a type the setter matches.
