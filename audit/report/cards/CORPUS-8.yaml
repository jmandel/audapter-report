# Full finding card CORPUS-8. Sections follow the fixed template (build.py REQUIRED).
id: CORPUS-8
log: CORPUS-8
notes: notes/corpus.md#corpus-8
headline: With the default frame settings, the logged pitch is wrong for voices below about 140 Hz
severity: med
studies:
  status: safe
  text: >-
    Safe as run: the time-domain pitch studies (pitchAdapt, pitchComp, pitchAdaptPD) use frameLen 64 / nDelay 7 with pitch bounds set around each participant's calibrated F0.
reach_kind: pitfall
reach: >-
  Not triggered by any blab design we inspected: none uses time-domain pitch shifting, the only mode that logs pitch. Affects time-domain pitch experiments with low voices at the default frame settings.
settings:
  source: 'Hypothetical design: time-domain pitch shifting as in Audapter''s time_domain_shift_demo, with blab''s male defaults.'
  override:
    preset: male
    params:
      bTimeDomainShift: 1
      bCepsLift: 1
      pitchLowerBoundHz: 70
      pitchUpperBoundHz: 300
      frameLen: 32 (default) or 64
      nDelay: 5 (default) or 7
    setparam:
      timeDomainPitchShiftSchedule: '[0, 2^(1/12); 100, 2^(1/12)] (+1 semitone throughout)'
    switching: each F0 in a fresh session
    input: synthetic vowels of known F0, 85-250 Hz; real speech in the table
  playground: false
  playground_why: the settings link carries one trial; the test case replays the whole per-F0 sweep and checks the logged pitchHz.
origin: upstream
status:
- H
what: >-
  With the time-domain pitch shifter on, Audapter tracks F0 and logs it as <code>pitchHz</code>. Its analysis window is frameLen × nDelay samples, 10 ms with the
  defaults, which holds too few cycles of a low voice. Below about 140 Hz the tracker returns a higher, wrong value, and the shifter's F0 filter is centred on it.
scope: >-
  Affects time-domain pitch shifting with the default frameLen 32 / nDelay 5 for typical adult male voices (85–130 Hz) and some low female voices. <code>pitchHz</code>
  and <code>shiftedPitchHz</code> are then not F0. The heard shift stayed close to target on real speech. With frameLen 64 / nDelay 7 (28 ms), as in Audapter's own
  time-domain shift demo, it is correct.
example: >-
  Synthetic vowels of known F0, each in a fresh session. With the default window a 90 Hz voice is logged at {m90:.0f} Hz, 110 Hz at {m110:.0f} Hz and 130 Hz at {m130:.0f}
  Hz; from {ok_from} Hz up the logged value is right. With frameLen 64 / nDelay 7 every F0 from 85 to 250 Hz is right.
figure_caption: >-
  Logged pitchHz against the true F0 of synthetic vowels, for the default and the longer window. Each point is one trial; the axis is F0, not time.
table:
- - synthetic
  - Logged pitchHz at true 90 / 110 / 130 Hz, default window
  - '{m90:.0f} / {m110:.0f} / {m130:.0f} Hz'
- - synthetic
  - Correct from (default window / 64 / 7)
  - '{ok_from} Hz / all F0 tested (≥ {b_min:.0f} % of frames within 5 %)'
- - real speech
  - 'Frames within 5 % of F0, default window: men / women / children'
  - '{r_r_m:.0f} / {r_r_f:.0f} / {r_r_c:.0f} %'
- - real speech
  - 'Same with frameLen 64 / nDelay 7: men / women'
  - '{r_q_m:.0f} / {r_q_f:.0f} %'
sketch: corpus8
asset_dir: corpus-8
audio: []
audio_note: 'No recordings for this card: the finding is about logged values, shown in the figure.'
real:
  dir: corpus-8
  data: ../blab/data.json
cause:
  summary: >-
    The tracker picks the strongest cepstral peak between the pitch bounds, but the cepstrum comes from the formant tracker's analysis buffer. A pitch period longer
    than about half the window gives no cepstral peak, so the search returns a spurious one.
  refs:
  - repo: blab-mex
    path: TransShiftMex/lpc_formant.cpp
    lines:
    - 678
    - 679
    hl:
    - 679
    expect: maxCepstralIndex
    note: The search range follows the pitch bounds, whatever the window can support.
  - repo: blab-mex
    path: TransShiftMex/lpc_formant.cpp
    lines:
    - 690
    - 697
    hl:
    - 697
    expect: smoothPitchTracker.track(indexMags)
    note: The strongest peak in that range becomes latestPitchHz, which is logged as pitchHz.
  - repo: blab-mex
    path: TransShiftMex/Audapter.cpp
    lines:
    - 1896
    - 1899
    hl:
    - 1898
    expect: fmtTracker->getLatestPitchHz()
    note: The estimate centres the time-domain shifter's F0 band-pass filter.
  fix: >-
    Warn when 2 / pitchLowerBoundHz is longer than the analysis window, or size the pitch analysis from the pitch bounds. Workaround: use frameLen 64 / nDelay 7 for
    low voices.
verify:
- kind: H
  what: synthetic F0 sweep (both configurations, fresh process each)
  name: harness/oct/report_corpus8.m
  detail: and an independent check, harness/oct/a_pitchtrack.m
- kind: H
  what: real speech, 80 clips
  name: harness/oct/corpus_shift.m
  detail: tdsdef vs tdsdemo groups
reproduce: cd audit/harness && SCEN="32 5" ./run-oct.sh report_corpus8.m
