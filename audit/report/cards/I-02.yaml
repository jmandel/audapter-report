# Full finding card I-02. Sections follow the fixed template (build.py REQUIRED).
id: I-02
log: I-02
notes: notes/interface.md#i-02
headline: >-
  In feedback mode 5, the speech-modulated noise is scaled by dScale twice, so the noise mix changes with the rig's calibration
severity: low
studies:
  status: affected
  text: >-
    Affected: sponAdapt3 uses fb 5 (the only blab study that does, apart from a demo); its speech-to-noise balance depends on dScale.
reach_kind: pitfall
reach: >-
  Not triggered: no blab experiment we inspected uses fb 5, which was added to blab in August 2026. Affects any fb 5 design with dScale other than 1.
settings:
  source: 'Hypothetical design: a plausible design, not one blab runs; blab''s default settings (getAudapterDefaultParams) unless listed.'
origin: blab
status:
- H
what: >-
  Feedback mode 5 plays a constant noise plus a noise that follows the speaker's loudness. The speech-modulated part is multiplied by <code>dScale</code> twice and
  the constant part once, so their balance moves by 20·log10(dScale) dB instead of staying at <code>fb5GainDB_speech</code>.
scope: >-
  Affects fb 5 only. <code>dScale</code> comes from <code>closedLoopGain</code> and the lab's calibration, so two setups, or one setup at two gains, get different
  mixes from the same parameter. A different microphone sensitivity is compensated by the input level, so the error follows <code>closedLoopGain</code>. fb 4 multiplies
  by <code>dScale</code> twice as well, but has only one component, so it is a level offset there. The logged <code>fb5GainDB_speech</code> is the nominal value.
example: >-
  fb 5 with babble noise and <code>fb5GainDB_speech</code> +20 dB. At <code>closedLoopGain</code> 15 dB (dScale {dsA:.3f}) the speech-modulated part sits {mix_db_A:+.1f}
  dB relative to the constant part; at 21 dB (dScale {dsB:.3f}) it sits {mix_db_B:+.1f} dB. The 6 dB gain step raises the constant noise by {play_step_db:.0f} dB
  and the speech-modulated noise by {speech_step_db:.0f} dB.
figure_caption: One trial per setting; the balance between the two components, expected and observed.
table:
- - synthetic
  - Mix (speech-modulated re constant), dScale 1
  - '{mix_db_ref:+.2f} dB'
- - synthetic
  - Mix at closedLoopGain 15 / 21 dB
  - '{mix_db_A:+.2f} / {mix_db_B:+.2f} dB'
- - synthetic
  - 'Level step for a 6 dB gain step: constant / speech-modulated'
  - '{play_step_db:.0f} / {speech_step_db:.0f} dB'
- - real speech
  - Mix change at dScale {r_ds_lo:.3f} / {r_ds_hi:.3f}
  - '{r_d_lo:+.1f} / {r_d_hi:+.1f} dB'
sketch: i02
asset_dir: i-02
audio:
- file: input_vowels.wav
  role: input
  label: 'Input: vowels'
- file: output_fb5_clg15.wav
  role: observed
  label: fb 5 at closedLoopGain 15 dB
- file: output_fb5_clg21.wav
  role: observed
  label: 'fb 5 at closedLoopGain 21 dB: the speech-modulated noise grows twice as much'
audio_note: All clips share one playback gain. Heard output at the device rate, decimated to 16 kHz.
real:
  dir: i-02
interactive:
  id: i-02
  variants:
  - shipped
  - fix-i-02
  patches:
    fix-i-02:
    - i-02-dscale-once.patch
  needs:
    recorder_s: 4.0
    shipped_playback: true
  button: Run fb 5 at both closedLoopGain settings on both builds
  inputs:
    input: dev_input_48k.wav
    babble: dev_babble_48k.wav
  params:
    rmsthresh: 0.005
    bdetect: 1
    btrack: 1
    fb: 5
    fb5gaindb_speech: 20
    fb5gain_playback: 1
  text: >-
    This runs the same input, babble and parameters as the harness through the real Audapter C++ core compiled to WebAssembly from the pinned commit, as released
    and with the one-line fix below, at the two <code>dScale</code> values. With the fix the balance no longer moves. Feedback mode 4 is unchanged.
cause:
  summary: >-
    fb 5 builds its speech-modulated component as <code>data_pb · rms_fb · fb5Gain_speech · dScale</code> and its constant component without <code>dScale</code>.
    <code>upSampSig</code> then multiplies the whole output by <code>dScale</code> again.
  refs:
  - repo: blab-mex
    path: TransShiftMex/Audapter.cpp
    lines:
    - 2197
    - 2201
    hl:
    - 2199
    expect: fb5Gain_speech * p.dScale
    note: 'fb 5: dScale on the speech-modulated term only.'
  - repo: blab-mex
    path: TransShiftMex/Audapter.cpp
    lines:
    - 2221
    - 2223
    hl:
    - 2223
    expect: p.downFact, p.dScale);
    note: Every output frame then goes through upSampSig with dScale as its scale factor...
  - repo: blab-mex
    path: TransShiftMex/Audapter.cpp
    lines:
    - 2660
    - 2660
    hl:
    - 2660
    expect: upfact * scalefact
    note: '...which multiplies the frame by it.'
  - repo: blab-mex
    path: TransShiftMex/Audapter.cpp
    lines:
    - 2195
    - 2196
    hl:
    - 2196
    expect: fb4Gain * p.dScale
    note: fb 4 has the same extra factor; with one component it only offsets the level.
  - repo: blab-matlab
    path: mcode/getAudapterDefaultParams.m
    lines:
    - 34
    - 34
    hl:
    - 34
    expect: p.dScale        = 10 ^
    note: dScale follows closedLoopGain and the rig calibration.
  - repo: blab-matlab
    path: mcode/getAudapterDefaultParams.m
    lines:
    - 132
    - 134
    hl:
    - 133
    expect: fb5GainDB_speech = 0.0
    note: The documented meaning of fb5GainDB_speech says nothing about dScale.
  fix: >-
    Drop <code>* p.dScale</code> from the fb 5 speech-modulated term (<code>report/patches/i-02-dscale-once.patch</code>, one line). Workaround: set <code>fb5GainDB_speech</code>
    to the intended value minus 20·log10(dScale).
verify:
- kind: H
  what: interface check
  name: scratch/interface/t_iface.m T3
  detail: recorded speech-modulated component per unit playback 0.0705 at dScale 1, 0.1409 at dScale 2
- kind: H
  what: report export (heard output, two closedLoopGain settings)
  name: report_i02.m
- kind: H
  what: patched WASM build vs shipped
  name: report/wasm/checks/fix-i-02.mjs
  detail: node audit/report/wasm/check-patches.mjs fix-i-02
reproduce: cd audit/harness && ./run-oct.sh report_i02.m
