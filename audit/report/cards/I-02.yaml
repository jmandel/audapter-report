audio:
  - {file: input_vowels.wav, role: input}
  - {file: output_fb5_clg15.wav, role: observed}
  - {file: output_fb5_clg21.wav, role: observed}
audio_note: "All clips share one playback gain, so level differences are real: the 21 dB clip is louder overall, as intended, but its speech-modulated noise has grown twice as much. Heard output (device rate) decimated to 16 kHz, 16-bit."
cause:
  summary: >
    In the fb 2–5 loop, fb 5 builds its speech-modulated component as <code>data_pb · rms_fb · fb5Gain_speech · dScale</code> and its playback
    component without <code>dScale</code>. The sum is then passed to <code>upSampSig</code>, which multiplies the whole output frame by
    <code>dScale</code> again. The speech-modulated part therefore carries <code>dScale²</code> and the playback part <code>dScale</code>.
  refs:
    - {repo: blab-mex, path: TransShiftMex/Audapter.cpp, lines: [2197, 2201], hl: [2199], expect: "fb5Gain_speech * p.dScale", note: "fb 5: dScale on the speech-modulated term only."}
    - {repo: blab-mex, path: TransShiftMex/Audapter.cpp, lines: [2221, 2223], hl: [2223], expect: "p.downFact, p.dScale);", note: "Every output frame then goes through upSampSig with dScale as its scale factor..."}
    - {repo: blab-mex, path: TransShiftMex/Audapter.cpp, lines: [2660, 2660], hl: [2660], expect: "upfact * scalefact", note: "...which multiplies the frame by it."}
    - {repo: blab-mex, path: TransShiftMex/Audapter.cpp, lines: [2195, 2196], hl: [2196], expect: "fb4Gain * p.dScale", note: "fb 4 has the same extra factor, unchanged from upstream."}
    - {repo: blab-matlab, path: mcode/getAudapterDefaultParams.m, lines: [34, 34], hl: [34], expect: "p.dScale        = 10 ^", note: "dScale follows closedLoopGain and the rig calibration."}
    - {repo: blab-matlab, path: mcode/getAudapterDefaultParams.m, lines: [132, 134], hl: [133], expect: "fb5GainDB_speech = 0.0", note: "The documented meaning of fb5GainDB_speech says nothing about dScale."}
  upstream_refs:
    - {repo: upstream-mex, path: TransShiftMex/Audapter.cpp, lines: [2026, 2026], expect: "fb4Gain * p.dScale"}
    - {repo: upstream-mex, path: TransShiftMex/Audapter.cpp, lines: [2049, 2049], expect: "p.downFact, p.dScale);"}
  fix: "Drop <code>* p.dScale</code> from the fb 5 speech-modulated term (<code>report/patches/i-02-dscale-once.patch</code>, one line), so both components get dScale once, from <code>upSampSig</code>. Whether fb 4 should change too is a separate, upstream question: fixing it would change the level of every existing fb 4 condition."
verify:
