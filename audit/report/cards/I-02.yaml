# Full finding card I-02. Rendered by build.py; see PLAN.md section 3 for the fields.
id: I-02
log: I-02
notes: "notes/interface.md#i-02"
headline: "In fb 5, raising closedLoopGain by 6 dB raises the speech-modulated noise by 12 dB, so the mix set by fb5GainDB_speech shifts by 6 dB"
severity: med
origin: blab
origin_note: "Feedback mode 5 is new in blab b2.5 (commit 169cadf, 'Feedback mode5 (#11)'). Its speech-modulated term copies fb 4's extra multiplication by dScale. Upstream 2.1.5's fb 4 already multiplies by dScale twice; there it only shifts the level of fb 4's single component, so we leave it alone and the patch below does not touch it. Found by reading and confirmed on the blab build; upstream has no fb 5 to run."
status: [H]
effect:
  setup: >
    <code>fb = 5</code> with the bundled babble (<code>mtbabble48k.wav</code>, zero mean, scaled to RMS 0.03) as <code>datapb</code>,
    <code>fb5Gain_playback = 1</code> and <code>fb5GainDB_speech = +20</code> dB, so that both parts are audible. Input: three vowels at
    different levels. The same input and parameters were run with <code>dScale</code> as <code>getAudapterDefaultParams</code> computes it from the
    bundled calibration, for <code>closedLoopGain</code> 15 dB (the default) and 21 dB, and with <code>dScale = 1</code> as a reference. Each run was
    repeated with <code>fb5Gain_playback = 0</code> to separate the two parts of the output.
  expected: "dScale is one overall output gain. Changing it moves everything the participant hears by the same number of dB, so the balance of speech-modulated to playback noise stays where fb5GainDB_speech puts it ({mix_db_ref:+.1f} dB during the vowels here, measured at dScale 1)."
  observed: "At closedLoopGain {clgA} dB (dScale {dsA:.3f}) the speech-modulated part sits {shift_A_db:+.1f} dB off that balance; at {clgB} dB (dScale {dsB:.3f}) it sits {shift_B_db:+.1f} dB off. Going from {clgA} to {clgB} dB raises the playback part by {play_step_db:.1f} dB and the speech-modulated part by {speech_step_db:.1f} dB."
  matters: >
    The balance between the two components is the manipulation fb 5 exists for, but its real value depends on <code>dScale</code>, which
    is rarely 1: it comes from <code>closedLoopGain</code> and each rig's calibration file (<code>micRMS_100dBA.mat</code>). Two sessions with the same
    <code>fb5GainDB_speech</code> but different <code>closedLoopGain</code> deliver different mixes, and <code>data.params</code> records only the nominal value.
    The effective value can be recomputed afterwards as <code>fb5GainDB_speech + 20·log10(dScale)</code>, since <code>dScale</code> is logged too (<code>data.params.scale</code>).
    (Where <code>dScale</code> differs only because microphones differ in sensitivity, the extra factor happens to be offset by the weaker or stronger
    microphone signal; the dependence on <code>closedLoopGain</code> remains.) At the defaults (0 dB, <code>rms_fb</code> of about 0.01–0.1) the speech-modulated
    part is 20–40 dB below the playback part, which is worth stating in the documentation either way.
  numbers:
    - ["dScale for closedLoopGain {clgA} / {clgB} dB (bundled calibration, {clg_bundled_db:.2f} dB)", "{dsA:.4f} / {dsB:.4f}"]
    - ["Speech-modulated re playback during vowels: dScale 1 (intended)", "{mix_db_ref:+.2f} dB"]
    - ["Same, closedLoopGain {clgA} dB / {clgB} dB", "{mix_db_A:+.2f} dB / {mix_db_B:+.2f} dB"]
    - ["Level change {clgA} → {clgB} dB: playback / speech-modulated", "{play_step_db:+.2f} dB / {speech_step_db:+.2f} dB"]
