  - {kind: H, what: "patched WASM build vs shipped", name: "report/wasm/checks/fix-i-02.mjs", detail: "node audit/report/wasm/check-patches.mjs fix-i-02"}
reproduce: "cd audit/harness && ./run-oct.sh report_i02.m"
