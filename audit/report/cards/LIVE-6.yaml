asset_dir: live-6
audio:
  - {file: input_vowel.wav, role: input}
  - {file: output_matched_buffer.wav, role: expected}
  - {file: output_buffer_128.wav, role: observed}
audio_note: >
  All clips share one playback gain, so level differences you hear are real. 48 kHz, 16-bit, the signal at the sound card (left channel;
  the right channel gets the odd-numbered mic samples). The expected clip is the same trial with a 96-sample buffer.
cause:
  summary: >
    <code>audioIO::startdev</code> requests <code>frameLen*downFact</code> samples and passes the variable to RtAudio, which may change it:
    with granularity −1 the ASIO code rounds to a power of two and then takes the driver's preferred size. Nobody compares the result with
    what Audapter needs. <code>handleBuffer</code> then sees a buffer of the wrong size and returns at once. RtAudio's user buffer still holds
    the mono input it copied in after the previous callback, and RtAudio plays that buffer as interleaved stereo output.
  refs:
    - {repo: blab-mex, path: rtaudio/RtAudio.cpp, lines: [5174, 5182], hl: [5176, 5182], expect: "else *bufferSize = preferSize;", note: "Granularity −1: the requested size is replaced by the driver's preferred size."}
    - {repo: blab-mex, path: audioIO/audioIO.cpp, lines: [89, 94], hl: [94], expect: "&buffer_size, 1);", note: "buffer_size is passed by pointer and may come back changed; it is never checked against algosize."}
    - {repo: blab-mex, path: TransShiftMex/Audapter.cpp, lines: [1667, 1668], hl: [1667, 1668], expect: "if (frame_size != p.downFact * p.frameLen)", note: "\"Just for safeguard\": the callback returns without touching the output buffer."}
    - {repo: blab-mex, path: rtaudio/RtAudio.cpp, lines: [5559, 5564], hl: [5562], expect: "callback(stream_.userBuffer, stream_.bufferSize, info->userData)", note: "The callback runs before the new input is copied in, so the untouched user buffer still holds the previous period's mono input, which is then played."}
    - {repo: blab-mex, path: TransShiftMex/mexLibrary.cpp, lines: [221, 228], hl: [224, 227], expect: "devpar.chans = 1;", note: "One input channel, two output channels: the mono input samples are read as interleaved left/right pairs."}
    - {repo: blab-mex, path: TransShiftMex/mexLibrary.cpp, lines: [333, 338], hl: [337], expect: "plhs[2] = mxCreateDoubleMatrix(1,1, mxREAL);", note: "With no frames processed, getData returns 1 × 1 and writes a third output (I-11)."}
  upstream_refs:
    - {repo: upstream-mex, path: audioIO/audioIO.cpp, lines: [89, 89], expect: "buffer_size = algosize;"}
    - {repo: upstream-mex, path: rtaudio/RtAudio.cpp, lines: [5182, 5182], expect: "else *bufferSize = preferSize;"}
    - {repo: upstream-mex, path: TransShiftMex/Audapter.cpp, lines: [1522, 1522], expect: "frame_size != p.downFact * p.frameLen"}
  fix: >
    In <code>audioIO::startdev</code>, after opening: <code>if (buffer_size != algosize) { stopdev(1); return 1; }</code>, and make
    <code>Audapter('start')</code> raise an error when <code>startdev</code> fails (see LIVE-4). The message should name the required buffer size.
verify:
  - {kind: D, what: "live simulation driver (fake ASIO, buffer 128) and JACK dummy server (period 128)", name: "live/run.sh mismatch", detail: "heard signal = raw-input model; getData 1 × 1, plhs[2] written"}
  - {kind: D, what: "report export (model check, levels, clips; JACK model check added here)", name: "report/live/export_live.py live6"}
reproduce: "audit/live/run.sh equiv mismatch && python3 audit/report/live/export_live.py live6"
