# Full finding card LIVE-6. Sections follow the fixed template (build.py REQUIRED).
id: LIVE-6
log: LIVE-6
notes: live/README.md#live-6
headline: >-
  If the sound card's buffer is not exactly frameLen × downFact samples, the participant hears their raw voice an octave up, chopped
severity: med
studies:
  status: na
  text: >-
    Depends on the rig, not the study: any study whose sound-card buffer differs from 96 samples at blab's settings.
reach_kind: pitfall
reach: >-
  Could affect any rig, including blab's: it happens whenever the sound card's buffer size differs from frameLen × downFact (96 samples at blab's settings). blab's Audapter README warns that newer Focusrite drivers crash MATLAB; whether that is related is untested.
settings:
  source: 'blab''s default frame settings (frameLen 32, downFact 3: 96 samples per buffer) on a sound card that delivers 128-sample buffers, simulated on the live audio path.'
  override:
    params: {}
    switching: one trial
    input: a vowel
  playground: false
  playground_why: this needs the live audio path.
origin: upstream
status:
- D
what: >-
  Audapter needs audio buffers of exactly <code>frameLen × downFact</code> samples (96 by default). If the sound card delivers another size, Audapter silently skips
  processing, and the headphones get an uninitialised copy of the microphone signal read at the wrong rate: the raw voice an octave up, silent in half of every buffer.
scope: >-
  Affects rigs whose ASIO driver does not grant the requested buffer size; RtAudio then takes the driver's preferred size without telling Audapter. Nothing warns,
  and <code>getData</code> returns almost nothing. With a matching buffer size everything is normal. These numbers come from a simulation of the live path (the real
  audio code, built with GCC on Linux, with a modelled ASIO driver), so rates are indicative.
example: >-
  A 128-sample device buffer instead of 96: over {callbacks} callbacks, Audapter processed nothing, <code>getData</code> returned {getdata_rows} row, and the participant
  heard the unprocessed voice decimated by 2 and gated on and off {gate_hz:.0f} times a second, {heard_re_mic_db:.1f} dB relative to the microphone.
figure_caption: 'Three 128-sample device buffers: what the callback does with each, and what reaches the headphones.'
table:
- - live simulation
  - Device buffer / Audapter frame
  - '{buf} / {frame} samples'
- - live simulation
  - Callbacks / rows returned by getData
  - '{callbacks} / {getdata_rows}'
- - live simulation
  - Heard level re microphone
  - '{heard_re_mic_db:.1f} dB, gated at {gate_hz:.0f} Hz'
sketch: live6
asset_dir: live-6
audio:
- file: input_vowel.wav
  role: input
- file: output_matched_buffer.wav
  role: expected
- file: output_buffer_128.wav
  role: observed
audio_note: >-
  All clips share one playback gain, so level differences you hear are real. 48 kHz, 16-bit, the signal at the sound card (left channel; the right channel gets the
  odd-numbered mic samples). The expected clip is the same trial with a 96-sample buffer.
  Synthetic only: the live-path simulation was run with this vowel.
cause:
  summary: >-
    <code>audioIO::startdev</code> requests <code>frameLen·downFact</code> samples and passes the variable to RtAudio, which may change it; nobody compares the result.
    <code>handleBuffer</code> then sees the wrong size and returns at once, leaving RtAudio's output buffer holding the microphone data.
  refs:
  - repo: blab-mex
    path: rtaudio/RtAudio.cpp
    lines:
    - 5174
    - 5182
    hl:
    - 5176
    - 5182
    expect: else *bufferSize = preferSize;
    note: 'Granularity −1: the requested size is replaced by the driver''s preferred size.'
  - repo: blab-mex
    path: audioIO/audioIO.cpp
    lines:
    - 89
    - 94
    hl:
    - 94
    expect: '&buffer_size, 1);'
    note: buffer_size is passed by pointer and may come back changed; it is never checked against algosize.
  - repo: blab-mex
    path: TransShiftMex/Audapter.cpp
    lines:
    - 1667
    - 1668
    hl:
    - 1667
    - 1668
    expect: if (frame_size != p.downFact * p.frameLen)
    note: '"Just for safeguard": the callback returns without touching the output buffer.'
  - repo: blab-mex
    path: rtaudio/RtAudio.cpp
    lines:
    - 5559
    - 5564
    hl:
    - 5562
    expect: callback(stream_.userBuffer, stream_.bufferSize, info->userData)
    note: >-
      The callback runs before the new input is copied in, so the untouched user buffer still holds the previous period's mono input, which is then played.
  - repo: blab-mex
    path: TransShiftMex/mexLibrary.cpp
    lines:
    - 221
    - 228
    hl:
    - 224
    - 227
    expect: devpar.chans = 1;
    note: >-
      One input channel, two output channels: the mono input samples are read as interleaved left/right pairs.
  - repo: blab-mex
    path: TransShiftMex/mexLibrary.cpp
    lines:
    - 333
    - 338
    hl:
    - 337
    expect: plhs[2] = mxCreateDoubleMatrix(1,1, mxREAL);
    note: With no frames processed, getData returns 1 × 1 and writes a third output (I-11).
  fix: >-
    After opening the device, fail if the buffer size differs from what Audapter needs, and make <code>Audapter('start')</code> report the failure with the required
    size. Workaround: set the ASIO driver's buffer to exactly frameLen × downFact.
verify:
- kind: D
  what: live simulation driver (fake ASIO, buffer 128) and JACK dummy server (period 128)
  name: live/run.sh mismatch
  detail: heard signal = raw-input model; getData 1 × 1, plhs[2] written
- kind: D
  what: report export (model check, levels, clips; JACK model check added here)
  name: report/live/export_live.py live6
reproduce: audit/live/run.sh equiv mismatch && python3 audit/report/live/export_live.py live6
fidelity: >-
  Simulation, not a Windows rig: the real mexFunction, audioIO.cpp and RtAudio ASIO code, built with GCC on Linux, driven by a fake ASIO driver in docker, and cross-checked
  through RtAudio's JACK backend. The heard signal follows deterministically from the code, so it should not depend on the machine; how a given ASIO driver reports
  its buffer sizes does.
