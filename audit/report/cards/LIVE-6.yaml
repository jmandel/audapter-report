# Full finding card LIVE-6 (the live consequence of I-11). Rendered by build.py; see PLAN.md section 3 for the fields.
# Data: live line (audit/live, fake ASIO driver + JACK dummy), exported by report/live/export_live.py.
id: LIVE-6
log: LIVE-6
notes: "live/README.md#live-6"
headline: "If the sound card's buffer is not exactly 96 samples, the participant hears their raw voice an octave up, chopped 375 times a second"
severity: med
origin: upstream
origin_note: "Inherited: upstream 2.1.5 has the same unchecked buffer size (audioIO.cpp:89), the same RtAudio negotiation (RtAudio.cpp:5182) and the same early return in handleBuffer (Audapter.cpp:1522 there). Known from reading both trees; the simulation ran the blab build."
fidelity: "Simulation, not a Windows rig: the real mexFunction, audioIO.cpp and RtAudio ASIO code, built with GCC on Linux, driven by a fake ASIO driver in docker, and cross-checked through RtAudio's JACK backend. The heard signal follows deterministically from the code, so it should not depend on the machine; how a given ASIO driver reports its buffer sizes does."
status: [D]
effect:
  setup: >
    Default parameters: <code>frameLen</code> 32 at 16 kHz × <code>downFact</code> 3 = a 96-sample callback at 48 kHz. The fake ASIO driver
    offers buffer sizes 64–2048 with a preferred size of 128 and granularity −1, as a control panel set to 128 samples would. One default-flow
    trial (<code>start</code>, 2 s, <code>stop</code>, <code>getData</code>) with a synthetic vowel at the microphone. Reference: the same trial with a
    96-sample buffer.
  expected: "Either Audapter processes the voice and plays it back (as with a 96-sample buffer), or start fails with an error."
  observed: "start succeeds and {callbacks} callbacks run, but every one returns without processing. The headphones get the raw microphone signal: in each {buf}-sample buffer the first half plays the mic samples of two buffers earlier at double speed (every second sample, one octave up) and the second half is silent (mean |x| = {half2_mean_abs:.0f}). The model matches the recorded headphone signal to {model_err:.1e}; through JACK it matches exactly (max error {jack_model_err:.0f})."
  matters: >
    The participant hears a buzzy, octave-up, unprocessed version of their own voice with no perturbation, no Audapter gain and no
    <code>dScale</code> calibration, and may simply carry on with the session. The data side fails only afterwards: <code>getData</code> returns 1 × 1
    arrays, so <code>AudapterIO('getData')</code> errors, and the MEX writes a third output MATLAB never allocated (I-11). The trigger is ordinary:
    ASIO control panels commonly offer 64, 128 or 256 samples, and RtAudio 3.0.3 replaces the requested 96 with the driver's preferred size
    whenever the driver reports granularity −1.
    <br><strong>Fidelity.</strong> Simulation, not a Windows rig: the real MEX, <code>audioIO.cpp</code> and RtAudio ASIO code, built with GCC on Linux, driven
    by a fake ASIO driver in docker and cross-checked through RtAudio's JACK backend. What is heard follows from the code; which buffer size a real
    driver hands over depends on that driver.
  numbers:
    - ["Device buffer / Audapter callback size", "{buf} / {frame} samples"]
    - ["Callbacks in the 2 s trial / rows returned by getData", "{callbacks} / {getdata_rows}"]
    - ["Outputs written past MATLAB's plhs", "{plhs_overflow}"]
    - ["Max |heard − model| (fake ASIO, Int32) / (JACK, float32)", "{model_err:.1e} / {jack_model_err:.1e}"]
    - ["Second half of every buffer, mean |x|", "{half2_mean_abs:.1e}"]
    - ["On/off gating rate / buffer length", "{gate_hz:.0f} Hz / {buf_ms:.2f} ms"]
    - ["Level during voicing re the mic: heard / Audapter output with a 96 buffer", "{heard_re_mic_db:+.1f} dB / {expected_re_mic_db:+.1f} dB"]
