# Full finding card OST-F1. Sections follow the fixed template (build.py REQUIRED).
id: OST-F1
log: OST-F1
notes: notes/ost-pcf.md#f1
headline: >-
  After a longer trial, the next trial's speech offset is detected late or not at all, so a perturbation tied to it runs on
severity: high
origin: upstream
status:
- H
- D
- F
what: >-
  <code>Audapter('reset')</code> does not clear the OST table's record of when the last rule fired (<code>lastStatEnd</code>). In the next trial, an INTENSITY_FALL
  rule cannot fire until the trial's frame count passes that stale value. A perturbation that should end at the speech offset stays on, and states that should start
  there start late or never.
scope: >-
  Affects OST files where an INTENSITY_FALL follows a rule that does not record its end time: ELAPSED_TIME, the hold branch of the ratio rules, and INTENSITY_RATIO_ABOVE_THRESH_WITH_RMS_FLOOR.
  It matters only after a trial whose fall came later than the current trial's offset. The example OST shipped with Audapter (RISE_HOLD → FALL → ELAPSED) is not affected,
  because its FALL follows a rule that records its end time. The first trial of a session always behaves correctly.
example: >-
  OST <code>0 ELAPSED_TIME 0.1</code> → <code>1 INTENSITY_FALL 0.01 0.02</code> → <code>2 OST_END</code>, with F1 raised 30 % in state 1. Trial A is one long vowel;
  trial B has two words, and state 1 should end after word 1. In a fresh session trial B reaches state 2 at {state2_B_fresh_s:.2f} s. Right after trial A, it reaches
  state 2 at {state2_B_after_A_s:.2f} s, just past the point where trial A's own state 2 began ({state2_A_s:.2f} s), and word 2 is heard with F1 raised.
figure_caption: >-
  Session 1 runs trial A, then reset(), then trial B, on one time axis. Session 2 is trial B in a fresh session, drawn under trial B for comparison.
table:
- - synthetic
  - Trial B state 2 onset, fresh session
  - '{state2_B_fresh_s:.2f} s'
- - synthetic
  - Trial B state 2 onset, after trial A
  - '{state2_B_after_A_s:.2f} s'
- - synthetic
  - 'Word 2 F1: input → heard after trial A'
  - '{word2_F1_in_hz:.0f} → {word2_F1_out_after_A_hz:.0f} Hz'
- - real speech
  - Trial pairs affected, card's OST
  - '{r_n_changed} of {r_n_pairs}'
- - real speech
  - Offset delay in affected pairs
  - '{r_late_min:.2f}–{r_late_max:.2f} s, or never detected ({r_n_never} pair)'
- - real speech
  - Trial pairs affected, example_data OST
  - 0 of 6
sketch: ost_f1
asset_dir: ost-f1
audio:
- file: trialB_input.wav
  role: input
  label: 'Trial B input: two vowels'
- file: trialB_output_fresh.wav
  role: expected
  label: Trial B output, fresh session
- file: trialB_output_after_A.wav
  role: observed
  label: Trial B output right after trial A
real:
  dir: ost-f1
  clips:
  - file: trialB_input.wav
    role: input
    label: Trial B input, "so he cares huh"
    sources:
    - libri_1988-24833-0010
  - file: trialB_output_fresh.wav
    role: expected
    label: Trial B output, first trial of the session
    sources:
    - libri_1988-24833-0010
  - file: trialB_output_after_A.wav
