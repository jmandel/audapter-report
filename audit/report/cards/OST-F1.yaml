# Full finding card OST-F1. Sections follow the fixed template (build.py REQUIRED).
id: OST-F1
log: OST-F1
notes: notes/ost-pcf.md#f1
headline: >-
  With some OST rule combinations, the "speech has ended" rule fires later on every trial, so a perturbation meant to stop
  at the end of a word runs on into the next word
severity: high
origin: upstream
status: [H, D, F]
studies:
  status: safe
  text: >-
    Safe as run: no blab OST, public or unpublished, has an INTENSITY_FALL preceded only by ELAPSED_TIME, the RMS-floor rule or a ratio rule (timeWrap uses the RMS-floor rule for onset, followed by a rise-and-hold rule).
reach_kind: pitfall
reach: >-
  Not triggered by any blab design we inspected: in all 69 blab OST files, public and unpublished, every INTENSITY_FALL has a
  rule that refreshes the stored time earlier in the same trial. Affects any design in which the only rules before an
  INTENSITY_FALL are ELAPSED_TIME, blab's RMS-floor onset rule (INTENSITY_RATIO_ABOVE_THRESH_WITH_RMS_FLOOR) or a ratio rule.
what: >-
  An OST remembers the frame at which a level-based rule last ended (<code>lastStatEnd</code>). <code>INTENSITY_FALL</code>, the
  usual "speech has ended" rule, may only fire once more than its minimum time has passed since that frame. <code>Audapter('reset')</code>
  does not clear the stored frame, and neither does reloading the OST or <code>AudapterIO('init')</code>. Rules that record their
  own end (the rise-and-hold, slope and stretch rules, and INTENSITY_FALL itself) overwrite it in every trial, so a FALL after them
  works. ELAPSED_TIME and the RMS-floor rule never write it, and the ratio rules write it only in a state that a normally numbered
  rule never reaches. A FALL right after one of those rules therefore waits for a frame from an earlier trial: the detected offset
  can never come earlier than the previous trial's offset plus the minimum time. It creeps later on every trial, and jumps after
  any long trial. The perturbation that should stop at the offset stays on.
scope: >-
  Matters when a perturbation (or the next state) is timed from a detected offset, no rule before the FALL in the trial refreshes the stored time, and
  the same Audapter session runs more than one trial. It does not matter whether the earlier trials were perturbed: only how long
  their speech lasted. The first trial after MATLAB starts is always correct, so a single-trial pilot will not show it.
  <strong>Safe if</strong> any INTENSITY_RISE_HOLD, INTENSITY_RISE_HOLD_POS_SLOPE, slope, stretch, FALL or INTENSITY_AND_RATIO rule runs before
  the FALL in the same trial (as in blab's measureFormants, bedhead, seven/sever and pedigree OSTs), or if no rule is timed from an offset.
example: >-
  A "shift the first word" design with catch trials: two-word trials, F1 raised 125 mel from the detected onset of word 1 to its
  detected offset, one catch trial in four, same OST all session and the PCF reloaded before every trial, with blab's standard
  settings. Onset is detected with blab's RMS-floor rule. The words are a real voice (a sustained /ɑ/ then /i/ of PVQD speaker
  SJ7001, cut to each trial's length). Trials 1 and 2 are correct. Trial 3 is a catch trial with a long first word (1.20 s); after
  it, trial 4's offset is found only at {R_t4_off_obs} instead of {R_t4_off_exp}, so word 2 (/i/) is heard with F1 raised
  ({R_t4w2_obs_pct} instead of {R_t4w2_exp_pct}; F1 {R_t4w2_in:.0f} → {R_t4w2_obs:.0f} Hz). After the second long catch trial the offset
  is never detected again (trials 7 and 8). The same session on synthetic vowels gives the same timings within 22 ms.
settings:
  source: "Hypothetical design: a plausible design, not one blab runs. Settings are blab's standard runner settings; the onset rule is blab's own (it is used in blab's timeWrap experiment, where the FALL follows a rise-and-hold rule and is safe)."
  input: "real voice (figure and main clips): PVQD speaker SJ7001 (female, no dysphonia), sustained /ɑ/ as word 1 cut to 0.30-1.20 s and sustained /i/ as word 2 (0.5 s), CC BY 4.0; synthetic (table, secondary clips, browser panel): /æ/-like and /e/-like vowels with the same timing"
  key_params: [bShift, bRatioShift, bMelShift, fb, fb3Gain]
  details:
  - "The safe variant differs only in its first rule: <code>0 INTENSITY_RISE_HOLD_POS_SLOPE 0.01 0.05 {}</code>, the onset rule of free-speech measureFormants.ost."
figure_caption: >-
  Trials 1–5 of the session, end to end. Expected: each trial as the first trial of a session (what the one-line fix gives).
  Observed: the same trials in one session. Settings as in the panel above; values under the words are F1 measured on the audio.
table:
- [real voice, 'Trial 4 (after the 1.20 s catch trial): offset detected', '{R_t4_off_obs} (expected {R_t4_off_exp})']
- [real voice, 'Trial 4, word 2 (/i/): F1 heard vs spoken', '{R_t4w2_obs_pct} (expected {R_t4w2_exp_pct}; {R_t4w2_in:.0f} → {R_t4w2_obs:.0f} Hz)']
- [synthetic, 'Trial 4 (after the 1.20 s catch trial): offset detected', '{t4_off_obs} (expected {t4_off_exp})']
- [synthetic, 'Trial 4, word 2: F1 heard vs spoken, measured on the audio', '{t4w2_obs_pct} (expected {t4w2_exp_pct}; {t4w2_in:.0f} → {t4w2_obs:.0f} Hz)']
- [synthetic, 'Perturbed trials with a late or missing offset', '{n_late} of {n_pert}; never detected in {n_never}']
- [synthetic, 'Ten identical trials in a row, no long trial', 'offset {same_step_ms:.0f} ms later on each trial; covers word 2 from trial {same_w2_trial}']
- [synthetic, 'OST reloaded before every trial', 'no help: first offset {reload_first}, never detected in {reload_never} perturbed trials']
- [synthetic, 'Same design with the rise-and-hold onset rule', 'every offset {safe_after_w1:.2f} s or less after word 1; identical to the expected run']
