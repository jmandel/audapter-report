interactive:
  id: ost-f1
  variants:
  - shipped
  - fix-ost-f1
  patches:
    fix-ost-f1:
    - ost-f1-reset-per-trial.patch
  needs:
    recorder_s: 2.0
  button: Run trials B, A, B on both builds
  inputs:
    trialA: dev_trialA_48k.wav
    trialB: dev_trialB_48k.wav
  params:
    rmsthresh: 0.005
    bdetect: 1
    btrack: 1
    bshift: 1
    bratioshift: 1
    bmelshift: 0
    f1min: 0
    f1max: 5000
    f2min: 0
    f2max: 5000
    lbk: 0
    lbb: 0
    pertf1:
      linspace:
      - 0
      - 5000
      - 257
    pertf2:
      linspace:
      - 0
      - 5000
      - 257
    pertamp:
      fill: 0
      n: 257
    pertphi:
      fill: 0
      n: 257
  text: >-
    This runs the same three trials through the real Audapter C++ core compiled to WebAssembly from the pinned commit, once as released and once with the fix below,
    with the harness inputs and parameters. Both builds reproduce the harness timings to the frame.
cause:
  summary: >-
    <code>OST_TAB::reset()</code> clears <code>lastStatEnd</code>, but nothing calls it: <code>Audapter::reset()</code> only sets <code>stat = 0</code>. INTENSITY_FALL
    fires only when <code>data_counter - lastStatEnd</code> exceeds the minimum duration, so a large value left over from trial A blocks it.
  refs:
  - repo: blab-mex
    path: TransShiftMex/ost.cpp
    lines:
    - 97
    - 101
    hl:
    - 99
    expect: lastStatEnd = 0
    note: The reset exists; nothing calls it.
  - repo: blab-mex
    path: TransShiftMex/Audapter.cpp
    lines:
    - 648
    - 652
    hl:
    - 651
    expect: stat = 0;
    note: Audapter::reset() resets the OST state index but not the OST table.
  - repo: blab-mex
    path: TransShiftMex/ost.cpp
    lines:
    - 546
    - 550
    hl:
    - 546
    expect: (data_counter - lastStatEnd) > minDurN
    note: INTENSITY_FALL compares this trial's frame counter with the stale lastStatEnd.
  fix: >-
    Call <code>ostTab.reset()</code> from <code>Audapter::reset()</code> (one line; <code>report/patches/ost-f1-reset-per-trial.patch</code>). Together with the OST-F2
    fix this is proven sufficient: trials then no longer depend on earlier trials. Workaround until then: <code>clear Audapter</code> between trials, or avoid an
    INTENSITY_FALL directly after ELAPSED_TIME.
verify:
- kind: H
  what: harness test
  name: t_ost.m
  test: 'OST F1: trial B (after A) offset detected'
- kind: H
  what: report export (vowels, audible)
  name: report_ost_f1.m
  detail: vowels, so the effect is audible
- kind: D
  what: standalone driver of ost.cpp
  name: scratch/ost-pcf/t/drv.cpp fall_leak
  detail: offset at frame 200 fired at frame 815
- kind: F
  what: Lean 4 proof, theorem trial_independent
  name: formal/lean/Ost.lean
  detail: >-
    with both fixes, every trial behaves like a trial on a freshly loaded OST, for every well-formed table and every input
- kind: F
  what: Lean 4 counterexamples
  name: formal/lean/OstCex.lean
  detail: each fix alone is not enough (ce1_leak, ce2_bug_drift)
reproduce: cd audit/harness && ./run-oct.sh t_ost.m
