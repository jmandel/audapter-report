interactive:
  id: ost-f1
  variants: [shipped, fix-ost-f1]
  patches:
    fix-ost-f1: [ost-f1-reset-per-trial.patch]
  needs:
    recorder_s: 2.5
  button: Run trials 1–5 on both builds
  inputs: {t1: dev_t1_48k.wav, t2: dev_t2_48k.wav, t3: dev_t3_48k.wav, t4: dev_t4_48k.wav, t5: dev_t5_48k.wav}
  params: {bshift: 1, bratioshift: 0, bmelshift: 1}
  text: >-
    This runs trials 1–5 of the example on the synthetic inputs (same timing, OST and PCFs; masking noise off, which does not affect detection) through the
    real Audapter core compiled to WebAssembly from the pinned commit, as released and with the one-line fix.
cause:
  summary: >-
    <code>OST_TAB::reset()</code> clears <code>lastStatEnd</code>, but nothing calls it: <code>Audapter::reset()</code> only sets
    <code>stat = 0</code>, and an OST reload frees and rebuilds the rule arrays but leaves <code>lastStatEnd</code> alone.
    INTENSITY_FALL fires only when <code>data_counter - lastStatEnd</code> exceeds its minimum, so a value left from an earlier
    trial blocks it. The RMS-floor rule, unlike the rise-and-hold rules, never sets <code>lastStatEnd</code>.
  refs:
  - {repo: blab-mex, path: TransShiftMex/ost.cpp, lines: [97, 101], hl: [99], expect: lastStatEnd = 0, note: The reset exists; nothing calls it.}
  - {repo: blab-mex, path: TransShiftMex/Audapter.cpp, lines: [648, 652], hl: [651], expect: stat = 0;, note: "Audapter::reset() resets the OST state index but not the OST table."}
  - {repo: blab-mex, path: TransShiftMex/ost.cpp, lines: [546, 550], hl: [546], expect: (data_counter - lastStatEnd) > minDurN, note: INTENSITY_FALL compares this trial's frame counter with the stored frame.}
  - {repo: blab-mex, path: TransShiftMex/ost.cpp, lines: [641, 665], hl: [641], expect: INTENSITY_RATIO_ABOVE_THRESH_WITH_RMS_FLOOR, note: "The RMS-floor rule advances the state but never writes lastStatEnd (compare lines 393 and 420 in the rise-and-hold rules)."}
  fix_label: Safe pattern and fix
  fix: >-
    <strong>Safe pattern:</strong> put INTENSITY_FALL only after a rule that records its end (INTENSITY_RISE_HOLD or
    INTENSITY_RISE_HOLD_POS_SLOPE, as blab's own OSTs do); if you need the RMS-floor onset, follow it with a short rise-and-hold rule
    before the FALL. Reloading the OST or re-running <code>AudapterIO('init')</code> does not help. <strong>Fix:</strong> call
    <code>ostTab.reset()</code> from <code>Audapter::reset()</code> (one line, <code>report/patches/ost-f1-reset-per-trial.patch</code>).
    With it, and the OST-F2 fix, every trial behaves like the first trial of a session (proven on a model of the OST code).
    <strong>Check past data:</strong> in <code>ost_stat</code>, compare the frame at which the offset state starts across trials;
    a creep of about the FALL minimum per trial, or a jump after a long trial, is this bug.
