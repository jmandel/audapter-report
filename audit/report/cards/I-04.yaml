log: I-04
notes: "notes/interface.md#i-04"
headline: "Reprocessing one recording under two conditions: the second condition is applied to the first condition's output"
severity: med
origin: upstream
origin_note: "The offline path (mexLibrary.cpp case 5 and audapterCallback) is unchanged from upstream 2.1.5 (reading; same lines in upstream). The export ran on the blab build only."
status: [H]
effect:
  setup: >
    Offline reprocessing the way <code>test_audapter.m</code> and <code>audapterDemo_triphthong.m</code> do it: the stored signal is cut into
    frames with <code>sigInCell = makecell(sigIn, frameLen*downFact)</code>, then <code>Audapter('runFrame', sigInCell{n})</code> runs for every frame.
    One stored 1.0 s /a/ is processed under condition 1 (1D field, F1 +20 %) and then condition 2 (F1 −20 %), once with the same
    <code>sigInCell</code> for both conditions, as a parameter sweep over one cell array would, and once with fresh frames per condition.
  expected: "Condition 2 lowers the recording's F1: heard {F1_c2_fresh_hz:.0f} Hz from an input of {F1_in_hz:.0f} Hz ({r_fresh:.2f}×), as with fresh frames."
  observed: "After condition 1, sigInCell holds condition 1's output (max change {cell_max_change:.2f}). Condition 2 therefore processes an already raised F1 (it tracks {logged_F1_c2_reused_hz:.0f} Hz, not {logged_F1_c2_fresh_hz:.0f} Hz) and the two shifts nearly cancel: heard F1 {F1_c2_reused_hz:.0f} Hz ({r_reused:.2f}× the input). Its signalIn starts with {lead0_c2_reused_in} zero samples ({lead0_ms:.0f} ms), condition 1's output delay. Condition 1 itself is {c1_same} between the two runs."
  matters: >
    Offline reprocessing is how labs check perturbation settings, rebuild feedback for analysis, or run a stimulus through several conditions.
    If a cell array of frames (or any variable passed to <code>runFrame</code> or <code>AudapterIO('process')</code>) is reused, every later run
    processes the previous run's output, silently. The data returned by <code>getData</code> are consistent with that wrong input, so nothing looks
    off: <code>signalIn</code> is the previous output. Two signs give it away: <code>signalIn</code> differs from the stored recording, and it starts with
    a run of exact zeros (the output delay of each earlier pass). Live ASIO experiments are not affected; there the buffer belongs to the audio driver.
  numbers:
    - ["F1 heard (independent LPC, 0.35–0.85 s): input", "{F1_in_hz:.0f} Hz"]
    - ["Condition 1 output (F1 +20 %)", "{F1_c1_hz:.0f} Hz ({r_c1:.2f}×)"]
    - ["Condition 2 output (F1 −20 %), fresh frames / reused sigInCell", "{F1_c2_fresh_hz:.0f} / {F1_c2_reused_hz:.0f} Hz"]
    - ["Condition 2 logged fmts F1 / sfmts F1: fresh", "{logged_F1_c2_fresh_hz:.0f} / {logged_sF1_c2_fresh_hz:.0f} Hz"]
    - ["Condition 2 logged fmts F1 / sfmts F1: reused", "{logged_F1_c2_reused_hz:.0f} / {logged_sF1_c2_reused_hz:.0f} Hz"]
    - ["Leading zero samples in condition 2's signalIn: fresh / reused", "{lead0_c2_fresh_in} / {lead0_c2_reused_in}"]
    - ["Largest change runFrame made to sigInCell", "{cell_max_change:.3f}"]
