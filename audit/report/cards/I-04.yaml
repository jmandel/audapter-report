audio_note: "All clips share one playback gain, so level differences are real. 16 kHz, 16-bit, as recorded by Audapter (signalIn, signalOut). Compare the two condition-2 clips: with fresh frames the vowel is darker (F1 lowered); from the reused cell array it sounds much like the input, because it lowers the already raised F1 of condition 1. No in-browser panel: the WASM interface copies each input frame before processing (audit/wasm/src/audapter_c.cpp, aud_process), so it cannot show this."
cause:
  summary: >
    Case 5 of the MEX gateway (<code>runFrame</code>) passes the pointer to MATLAB's input array straight to <code>audapterCallback</code>, which
    calls <code>handleBuffer</code> with the same pointer as input and output buffer. <code>handleBuffer</code> writes the processed frame into its
    output pointer at the end, so the caller's array now holds the output. MEX inputs are meant to be read-only, and MATLAB shares an array's data
    between variables until one is modified, so every variable sharing that data changes too. This is the mechanism behind the methods note on
    "identical trials that diverged" (NEG-1): our own harness was feeding outputs back in until we copied each frame.
  refs:
    - {repo: blab-mex, path: TransShiftMex/mexLibrary.cpp, lines: [361, 364], hl: [361, 364], expect: "data_ptr = (double*)mxGetPr(prhs[1]);", note: "The MATLAB input array (prhs[1]) is handed over as the audio buffer, without a copy."}
    - {repo: blab-mex, path: TransShiftMex/Audapter.cpp, lines: [74, 77], hl: [77], expect: "handleBuffer((dtype *)buffer, (dtype *)buffer, buffer_size, true)", note: "Input and output are the same buffer."}
    - {repo: blab-mex, path: TransShiftMex/Audapter.cpp, lines: [2256, 2259], hl: [2258], expect: "outFrame_ptr[n] = outputBuf[n];", note: "The processed frame overwrites it."}
    - {repo: blab-matlab, path: mcode/test_audapter.m, lines: [103, 105], hl: [104], expect: "Audapter('runFrame', sigInCell{n});", note: "The pattern in the bundled scripts (also audapterDemo_triphthong.m:90, time_domain_shift_demo.m:109): fine once, wrong if sigInCell is used again."}
  upstream_refs:
    - {repo: upstream-mex, path: TransShiftMex/mexLibrary.cpp, lines: [360, 363], expect: "audapterCallback((char *)data_ptr"}
    - {repo: upstream-mex, path: TransShiftMex/Audapter.cpp, lines: [77, 77], expect: "(dtype *)buffer, (dtype *)buffer, buffer_size, true"}
  fix: "In case 5, copy <code>prhs[1]</code> into a scratch buffer (or <code>mxDuplicateArray</code>) and process that; return the output as <code>plhs[0]</code> if callers want it. Until then, pass <code>sigInCell{n} + 0</code> or rebuild the cell array for every condition."
