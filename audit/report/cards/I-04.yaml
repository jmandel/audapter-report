# Full finding card I-04. Sections follow the fixed template (build.py REQUIRED).
id: I-04
log: I-04
notes: notes/interface.md#i-04
headline: >-
  Reprocessing one recording under two conditions applies the second condition to the first condition's output
severity: low
studies:
  status: safe
  text: >-
    Safe as run: blab's offline helpers (audapter_viewer, check_audapterLPC) build fresh frames for every run.
reach_kind: pitfall
reach: >-
  Not triggered by blab's offline helpers (audapter_viewer, check_audapterLPC), which build fresh frames for every run. Affects offline reprocessing that reuses one frame array for several conditions.
settings:
  source: 'Hypothetical design: a plausible design, not one blab runs; blab''s default settings (getAudapterDefaultParams) unless listed.'
origin: upstream
status:
- H
what: >-
  <code>Audapter('runFrame', x)</code> writes its output back into the array it is given. A script that runs the same stored frames through Audapter twice, for two
  conditions, feeds the first condition's output into the second.
scope: >-
  Affects offline reprocessing that reuses the same MATLAB variables, for example the cell array of frames in <code>test_audapter.m</code>, and anything else sharing
  that data. Scripts that build fresh frames for each run are unaffected. Live experiments are unaffected.
example: >-
  One stored /a/ (F1 {F1_in_hz:.0f} Hz) processed as condition 1 (F1 +20 %) and then condition 2 (F1 −20 %) from the same cell array. Condition 2 is heard at {F1_c2_reused_hz:.0f}
  Hz instead of {F1_c2_fresh_hz:.0f} Hz, because it lowered F1 of an already raised vowel. Its logged input starts with {lead0_c2_reused_in} zero samples, the first
  condition's output delay.
figure_caption: >-
  Two runs of the same stored recording, one after the other: condition 1, then condition 2 from the same frames (observed) or from fresh frames (expected).
table:
- - synthetic
  - 'Condition 2 heard F1: fresh frames / reused frames'
  - '{F1_c2_fresh_hz:.0f} / {F1_c2_reused_hz:.0f} Hz'
- - synthetic
  - 'Condition 2 logged F1 (tracker): fresh / reused'
  - '{logged_F1_c2_fresh_hz:.0f} / {logged_F1_c2_reused_hz:.0f} Hz'
- - synthetic
  - 'Leading zero samples in condition 2''s logged input: fresh / reused'
  - '{lead0_c2_fresh_in} / {lead0_c2_reused_in}'
sketch: i04
asset_dir: i-04
audio:
- file: input.wav
  role: input
  label: 'Input: /a/'
- file: cond1_output.wav
  role: observed
  label: 'Condition 1: F1 +20 %'
- file: cond2_output_fresh.wav
  role: expected
  label: 'Condition 2 from fresh frames: F1 −20 %'
- file: cond2_output_reused.wav
  role: observed
  label: 'Condition 2 from the reused frames: the shifts cancel'
audio_note: >-
  All clips share one playback gain. 16 kHz, 16-bit, as recorded by Audapter. Synthetic only: the effect is exact sample reuse, the same for any input; the figure's numbers come from this vowel.
cause:
  summary: >-
    The MEX gateway passes the pointer to MATLAB's input array straight to <code>audapterCallback</code>, which calls <code>handleBuffer</code> with the same pointer
    as input and output. MATLAB arrays that share data with the variable are changed too.
  refs:
  - repo: blab-mex
    path: TransShiftMex/mexLibrary.cpp
    lines:
    - 361
    - 364
    hl:
    - 361
    - 364
    expect: data_ptr = (double*)mxGetPr(prhs[1]);
    note: The MATLAB input array (prhs[1]) is handed over as the audio buffer, without a copy.
  - repo: blab-mex
    path: TransShiftMex/Audapter.cpp
    lines:
    - 74
    - 77
    hl:
    - 77
    expect: handleBuffer((dtype *)buffer, (dtype *)buffer, buffer_size, true)
    note: Input and output are the same buffer.
  - repo: blab-mex
    path: TransShiftMex/Audapter.cpp
    lines:
    - 2256
    - 2259
    hl:
    - 2258
    expect: outFrame_ptr[n] = outputBuf[n];
    note: The processed frame overwrites it.
  - repo: blab-matlab
    path: mcode/test_audapter.m
    lines:
    - 103
    - 105
    hl:
    - 104
    expect: Audapter('runFrame', sigInCell{n});
    note: >-
      The pattern in the bundled scripts (also audapterDemo_triphthong.m:90, time_domain_shift_demo.m:109): fine once, wrong if sigInCell is used again.
  fix: >-
    Copy the input in the gateway before processing, and return the output as a result. Workaround: pass a copy, e.g. <code>Audapter('runFrame', frame + 0)</code>,
    or rebuild the frames for each condition.
verify:
- kind: H
  what: harness test
  name: t_inplace.m
  test: runFrame leaves input variable untouched
- kind: H
  what: determinism with input copies (NEG-1)
  name: t_repeat.m
  test: 'repeat: identical signalOut'
- kind: H
  what: 'report export: two conditions, fresh vs reused frames'
  name: report_i04.m
  detail: condition 2 on the reused cell array tracks condition 1's output
- kind: H
  what: interface check
  name: scratch/interface/t_iface.m T4
  detail: the input and an alias of it were both modified
reproduce: cd audit/harness && ./run-oct.sh report_i04.m
