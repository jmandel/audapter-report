# Full finding card COORD-1. Sections follow the fixed template (build.py REQUIRED).
id: COORD-1
log: COORD-1
notes: FINDINGS-LOG.md
headline: >-
  A PCF loaded for one experiment stays loaded through AudapterIO('init') and silently switches off a later field-mode formant shift
severity: med
origin: upstream
status:
- H
what: >-
  Loading an OST/PCF pair makes Audapter take its formant perturbation from the PCF instead of from the perturbation-field parameters. <code>AudapterIO('init')</code>
  sets every parameter but does not unload the OST/PCF. A field-mode experiment run later in the same MATLAB session is then driven by the leftover PCF.
scope: >-
  Affects any session that runs a PCF-based experiment (pitch shift, OST-timed formant shift, time warp) and later a field-mode formant experiment without <code>clear
  Audapter</code> or <code>Audapter('pcf', '', 0)</code>. With a PCF whose formant rows are zero, the field shift disappears; with non-zero rows, the PCF's shifts
  replace the field's. The logged parameters still show the field settings.
example: >-
  A field experiment raises F1 by 20 % on a vowel. In a fresh session it shifts {fresh} frames and the heard F1 goes from {F1_in:.0f} to {F1_fresh:.0f} Hz. Run after
  a pitch experiment with Audapter's <code>example_data/pitch_pert.pcf</code> and <code>AudapterIO('init')</code>, it shifts {after} frames and the heard F1 stays
  at {F1_after:.0f} Hz. No warning is printed.
figure_caption: >-
  Session 1 runs the PCF experiment, then AudapterIO('init'), then the field experiment, on one time axis. Session 2 runs the field experiment in a fresh session,
  drawn under it.
table:
- - synthetic
  - 'Frames shifted: fresh session / after the PCF experiment'
  - '{fresh} / {after}'
- - synthetic
  - 'Heard F1: input / fresh / after'
  - '{F1_in:.0f} / {F1_fresh:.0f} / {F1_after:.0f} Hz'
- - real speech
  - 'Frames shifted on a sentence: fresh / after'
  - '{r_fresh} / {r_after}'
sketch: coord1
asset_dir: coord-1
audio:
- file: input.wav
  role: input
  label: 'Input: a vowel'
- file: output_fresh.wav
  role: expected
  label: 'Field experiment in a fresh session: F1 +20 %'
- file: output_after_pcf.wav
  role: observed
  label: 'The same experiment after a PCF experiment: unshifted'
real:
  dir: coord-1
  clips:
  - file: input.wav
    role: input
    label: Input, "I had faith in them."
    sources:
    - arctic_bdl_a0030
  - file: output_fresh.wav
    role: expected
    label: Field experiment, fresh session (F1 +20 %)
    sources:
    - arctic_bdl_a0030
  - file: output_after_pcf.wav
    role: observed
    label: Same experiment after a PCF experiment (unshifted)
    sources:
    - arctic_bdl_a0030
cause:
  summary: >-
    With a PCF loaded (<code>pertCfg.n &gt; 0</code>), the formant branch takes the on/off decision, amplitude and phase from the PCF row of the current OST state.
    Only <code>Audapter('pcf', '', 0)</code> unloads a PCF, and <code>AudapterIO('init')</code> never calls it.
  refs:
  - repo: blab-mex
    path: TransShiftMex/Audapter.cpp
    lines:
    - 1806
    - 1812
    hl:
    - 1811
    expect: during_trans = (pertCfg.fmtPertAmp[stat] != 0);
    note: >-
      With a PCF loaded, the PCF row decides whether to shift at all; pitch_pert.pcf's formant amplitude is 0, so never.
  - repo: blab-mex
    path: TransShiftMex/Audapter.cpp
    lines:
    - 1838
    - 1843
    hl:
    - 1840
    - 1841
    - 1842
    expect: That using ost and pcf files overrides the perturbation field
    note: '...and supplies amplitude and phase, as the comment intends for OST/PCF experiments.'
  - repo: blab-matlab
    path: mcode/AudapterIO.m
    lines:
    - 427
    - 434
    hl:
    - 429
    expect: Audapter(9, params);
    note: Only this action loads or clears a PCF; the 'init' case (lines 8–415) never calls it.
  fix: >-
    Unload the OST and PCF in <code>AudapterIO('init')</code> unless the caller asks to keep them, or warn when a PCF is loaded while field parameters are set. Workaround:
    call <code>Audapter('ost', '', 0)</code> and <code>Audapter('pcf', '', 0)</code>, or <code>clear Audapter</code>, between experiments.
verify:
- kind: H
  what: harness test (added to run-tests.sh)
  name: t_pcf_persist.m
  detail: 'FAIL as expected: shifted frames fresh 435, after an earlier PCF experiment 0'
- kind: H
  what: report export (synthetic and real speech)
  name: harness/oct/report_coord1.m
  detail: a vowel and a real sentence, fresh and after a PCF experiment
reproduce: cd audit/harness && ./run-oct.sh t_pcf_persist.m
