interactive:
  id: i-01
  variants:
  - shipped
  - fix-i-01
  patches:
    fix-i-01:
    - i-01-datapb-loop-length.patch
  needs:
    shipped_playback: true
  button: Run a 12 s trial on both builds
  inputs:
    babble: dev_babble_every3rd_16k.wav
    vowels: dev_vowels3_48k.wav
  params:
    rmsthresh: 0.005
    bdetect: 1
    btrack: 1
    fb2gain: 0.05
    fb3gain: 0.05
    dscale: 1
  text: >-
    This runs a 12 s trial through the real Audapter C++ core compiled to WebAssembly from the pinned commit, once as released and once with the noise looping at
    the length that was loaded. Both builds keep the shipped 480000-sample playback buffer. Pick the length of the noise file, cut from the bundled babble and loaded
    as <code>runExperiment.m</code> does it (zero mean, unit RMS). The page ships only every third sample of the babble, the only samples the fb 2–5 loop reads, and
    rebuilds the 48 kHz buffer from them, so Audapter reads the same values it would read from the full-rate file. The bars come from a noise-only run (fb 2), and
    Play gives the voice + noise run (fb 3). Both use the 48 kHz output Audapter returns for every frame, which lags <code>signalOut</code> by a few milliseconds.
    The build used here records only 10 s, so its <code>signalOut</code> would not cover a 12 s trial.
cause:
  summary: >-
    The fb 2–5 loop advances <code>pbCounter</code> and wraps it at the compile-time <code>maxPBSize</code>. Setting <code>datapb</code> zero-fills the rest of the
    buffer, and only setting <code>datapb</code> resets <code>pbCounter</code>.
  refs:
  - repo: blab-mex
    path: TransShiftMex/Audapter.cpp
    lines:
    - 2202
    - 2204
    hl:
    - 2203
    expect: pbCounter >= maxPBSize
    note: The wrap uses the buffer capacity.
  - repo: blab-mex
    path: TransShiftMex/Audapter.cpp
    lines:
    - 1216
    - 1219
    hl:
    - 1217
    - 1218
    expect: Zero out the remaining part
    note: Loading a shorter datapb fills the rest of the buffer with zeros.
  - repo: blab-mex
    path: TransShiftMex/Audapter.h
    lines:
    - 176
    - 176
    hl:
    - 176
    expect: maxPBSize = 480000
    note: The loop length, whatever length was loaded (it was 230400 before the blab-lab fork).
  - repo: blab-matlab
    path: mcode/runExperiment.m
    lines:
    - 325
    - 330
    hl:
    - 325
    expect: getMaxPBLen
    note: Callers truncate to the maximum but never pass the actual length to the playback loop.
  fix: >-
    Store the loaded length when <code>datapb</code> is set and wrap there (<code>report/patches/i-01-datapb-loop-length.patch</code>); rewind <code>pbCounter</code>
    in <code>reset()</code>. Workaround: tile the noise to exactly 480000 samples before loading it.
