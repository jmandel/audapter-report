# Full finding card I-01. Sections follow the fixed template (build.py REQUIRED).
id: I-01
log: I-01
notes: notes/interface.md#i-01
headline: >-
  Playback loops at the fixed 10 s buffer length, not at the loaded noise length, so any noise shorter than 10 s is followed by silence
severity: high
origin: blab-amplified
since: >-
  Wrapping at the buffer size is long-standing; the buffer grew from 4.8 s to 10 s in the blab-lab fork (commit 3c90a3a), which is when noise files shorter than 10
  s started to leave a silent stretch.
status:
- H
what: >-
  In feedback modes 2 to 5 Audapter plays the loaded <code>datapb</code> waveform, such as masking noise, in a loop. The loop point is the end of the 480000-sample
  (10 s) buffer, not the end of the loaded waveform, and the rest of the buffer is filled with zeros. A shorter noise file therefore plays once and is followed by
  silence until the 10 s mark.
scope: >-
  Affects every fb 2–5 condition whose playback waveform is shorter than 10 s at 48 kHz: masking noise, noise plus voice, and speech-modulated noise. <code>Audapter('reset')</code>
  does not rewind the playback position, so the silent stretch falls at a different point in each trial. The bundled 10 s babble file is 770 samples short and leaves
  a 16 ms dropout every 10 s.
example: >-
  Voice plus masking noise (fb 3) with the first 5 s of the bundled babble, loaded the way <code>runExperiment.m</code> loads noise, over a 12 s trial: the noise
  plays from 0 to 5 s, stops from 5 to 10 s, and resumes at 10 s. During the gap the participant hears their own voice unmasked.
figure_caption: One 12 s trial. The expected row shows the 5 s file looping; the observed row shows what is played.
table:
- - synthetic
  - Noise gap in a 12 s trial, 5 s noise file
  - '{gaps_text}'
- - synthetic
  - 'Second trial after reset(): the noise stops at'
  - '{trial2_gap_start_s:.1f} s into the trial'
- - synthetic
  - Bundled babble (479230 samples)
  - 16 ms of silence every 10 s
- - real speech
  - Noise gap, real sentences as the voice
  - '{r_noise_gap_start_s:.1f}–{r_noise_gap_end_s:.1f} s'
