# Full finding card I-01. Sections follow the fixed template (build.py REQUIRED).
id: I-01
log: I-01
notes: notes/interface.md#i-01
headline: >-
  Since b2.4 (April 2026), masking noise drops out for 16 ms about once every 10 s, in about one of every five or six trials of a blab masking phase
severity: high
origin: blab-amplified
since: >-
  Only since blab b2.4 (commit 3c90a3a, 6 April 2026), which enlarged the playback buffer from 230,400 to 480,000 samples. Data
  collected with earlier versions are not affected: the bundled babble was truncated to the old buffer and looped seamlessly.
status: [H]
studies:
  status: affected
  text: >-
    Affected, on data collected with b2.4 or later (since April 2026) only: runners that load the noise once per session, so its position runs on across trials. Public: <a class="permalink" href="https://github.com/blab-lab/simonSingleWord/blob/df6712020e59dae86e303d5cea599c2412aaa206/experiment%20scripts/run_simonSingleWord_v2_audapter.m#L80">simonSingleWord v2</a>, <a class="permalink" href="https://github.com/blab-lab/simonSingleWord/blob/df6712020e59dae86e303d5cea599c2412aaa206/experiment%20scripts/run_simonSingleWord_audapter.m#L65">v1</a>, <a class="permalink" href="https://github.com/blab-lab/simonMulti/blob/e05f155dfba07110026688d8f000068cee1c9249/experiment%20scripts/Exp1/run_coAdapt_audapter.m#L67">coAdapt</a>, <a class="permalink" href="https://github.com/blab-lab/simonMulti/blob/e05f155dfba07110026688d8f000068cee1c9249/experiment%20scripts/Exp2/run_simonMultisyllable_v2_audapter.m#L59">simonMultisyllable v2</a>, <a class="permalink" href="https://github.com/blab-lab/attentionAAF/blob/0f4ef4301ef10144fcbc2a75b990207a9e9441fd/run_attentionComp_audapter.m#L50">attentionComp</a>, <a class="permalink" href="https://github.com/blab-lab/attentionAAF/blob/0f4ef4301ef10144fcbc2a75b990207a9e9441fd/run_attentionAdapt_audapter.m#L68">attentionAdapt</a>, <a class="permalink" href="https://github.com/blab-lab/uhdapter/blob/92aa1c0a45756267d73414d291a0c38fb02d68bc/run_uhdapter_audapter.m#L175">uhdapter</a>, <a class="permalink" href="https://github.com/blab-lab/vsaCentralize/blob/9beb9a7767418cae5d681b35fb1e0cc010331d02/run_vsaAdapt2_audapter.m#L56">vsaCentralize</a> (its committed experiment script calls a runner that is not in the repository), <a class="permalink" href="https://github.com/blab-lab/vsaGeneralize/blob/0ec575ae1cde8402628b6cb5cd756467a95dd11d/run_vsaGeneralize_audapter.m#L63">vsaGeneralize</a>, <a class="permalink" href="https://github.com/blab-lab/vsaSentence/blob/c01942f1381237fd8c205e06e7c1472d72e4e685/run_vsaSentence_audapter.m#L61">vsaSentence</a>, <a class="permalink" href="https://github.com/carrien/free-speech/blob/ec961b7a04a79199217f4973effda9157afcdf9d/templates/modelExpt/run_modelExpt_audapter.m#L79">the free-speech template</a> (each link is the line that loads the noise once). Unpublished: timeAdapt, timeWrap, varMod, sponAdapt, vsaRetention, diphthongAdapt, brut, vin, and the simon and cerebellar studies. Safe as run: runners that reload the noise before every trial, which rewinds it (the MRI and iEEG interleaved runners, noGoAdapt, varModAdapt, compRetest). How audible: in fb 3 (most runners; babble at gain 0.02 under the participant's own voice) a 16 ms dropout is subtle; fb 2 studies (brut, vin, and the masking phases of simonSingleWord v2, uhdapter and vsaSentence) and fb 4 studies (vsaGeneralize, biteblockAdapt, diphthongAdapt, sponAdapt, sponAdapt2, vsaRetention) are more exposed, because the noise is all or most of what is heard.
reach_kind: current
reach: >-
  Affects blab's current experiments on b2.4 and later.
what: >-
  In feedback modes 2–5 Audapter plays the loaded noise (<code>datapb</code>) in a loop. It loops at the end of its 480,000-sample
  (10 s) buffer, not at the end of the noise that was loaded, and the unused end of the buffer is silence. The bundled babble is
  479,230 samples, 770 short of the buffer, so once per 10 s of running time the participant hears 16 ms of silence instead of
  noise. The noise position carries on from trial to trial (<code>reset</code> does not rewind it), so the dropout lands at a
  different point in each affected trial. A noise file much shorter than 10 s gives a correspondingly longer silence.
scope: >-
  Matters whenever masking noise is meant to be continuous, most of all in fb 2 masking phases (transfer or noise-baseline phases),
  where the noise is all the participant hears and a dropout briefly unmasks their own voice. In fb 3 phases the babble is
  quiet (fb3Gain 0.02) and a 16 ms dropout is less noticeable. <strong>Safe if</strong> the loaded noise is exactly 480,000
  samples, or on versions before b2.4.
example: >-
  The masking phase of blab's simonSingleWord v2 experiment (fb 2, fb2Gain 0.16, 1.8 s trials, <code>AudapterIO('init')</code>
  every trial, the bundled babble loaded once with get_noiseSource). Over {n_trials} trials the current build plays
  {n_gaps} silences of {gap_ms_min:.0f} ms, in trials {gap_trials}, at {gap_times} into the trial. With the pre-b2.4 buffer the
  same session plays none.
settings:
  source: "blab's simonSingleWord v2 experiment, masking (transfer) phase: fb 2 at fb2Gain 0.16, 1.8 s trials, init every trial, the bundled babble via free-speech get_noiseSource."
  key_params: [fb, fb2Gain, bShift, bRatioShift, bMelShift]
  build: "Observed: blab-lab audapter_mex as shipped (@169cadf, buffer 480,000). Expected: the same session with the pre-b2.4 buffer (230,400), which get_noiseSource then truncates the babble to."
figure_caption: >-
  Trials 5–7 of the session, end to end (the gap in trial 6 is widened in the drawing so it is visible). Silence is detected on the
  audio of each trial.
table:
- [simonSingleWord v2, 'Silent gaps in 24 masking trials (current build)', '{n_gaps}, each {gap_ms_min:.0f} ms, in trials {gap_trials}']
- [simonSingleWord v2, 'Same session, pre-b2.4 buffer', '{up_gaps} gaps']
- [real sessions (labrun), 'modelExpt and vsaGeneralize full sessions run with their own scripts', '15.4 ms holes every 10.0 s of noise running time (9–12 and 22–34 holes per session with eight AI-generated voices)']
- [simonSingleWord v2, 'How often', 'every {every_s:.1f} s of running time: about 1 in {one_in:.1f} trials of 1.8 s']
- [general case, 'A 5 s noise file in a 12 s trial', 'no noise {gaps_text}']
