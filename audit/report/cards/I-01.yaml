  name: scratch/interface/t_iface.m T1
  detail: 'fb 2: mean |out| 0.100 for 0–4.9 s, 0.000 for 5.1–9.9 s'
- kind: H
  what: report export
  name: report_i01.m
  detail: 12 s trials with a 5 s noise file
reproduce: cd audit/harness && ./run-oct.sh report_i01.m
