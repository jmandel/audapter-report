audio_note: >
  All three clips share one playback gain, chosen so that the burst clip peaks at −1 dBFS; the other clips play at their true level relative
  to it, so the speech is quiet. 48 kHz, 16-bit, the signal at the sound card (clipped at full scale as a DAC would play it), 1 s around the
  reset. The observed clip is an excerpt of the live line's <code>results/reset_race_burst.wav</code>.
cause:
  summary: >
    <code>Audapter::reset()</code> runs on the MATLAB thread with no lock against the audio callback. Among other things it zeroes the
    state of the 48 ↔ 16 kHz resampling filters. The callback may be in the middle of <code>IIR_Filter::filter</code> at that moment. These
    high-order IIR filters carry large internal state values that normally cancel; zeroing part of the state mid-frame leaves the rest
    uncancelled, and the filter rings out beyond full scale for a few milliseconds.
  refs:
    - {repo: blab-mex, path: TransShiftMex/Audapter.cpp, lines: [522, 538], hl: [537, 538], expect: "upSampFilter.reset();", note: "reset() zeroes the resampling filter states. Nothing stops the callback from running at the same time."}
    - {repo: blab-mex, path: TransShiftMex/filter.h, lines: [42, 46], hl: [44], expect: "delay[i] = 0.0;", note: "The reset clears the delay line element by element..."}
    - {repo: blab-mex, path: TransShiftMex/filter.h, lines: [59, 65], hl: [60, 62], expect: "delay[k] = g * b[k + 1] * x[m] + delay[k + 1] - a[k + 1] * y[m];", note: "...while the callback's filter loop reads and writes the same delay line for every sample."}
    - {repo: blab-mex, path: TransShiftMex/Audapter.cpp, lines: [608, 611], hl: [609, 611], expect: "data_counter=0;", note: "The frame counters are cleared last. A callback between the two counter increments leaves the new trial with an offset frame clock."}
    - {repo: blab-mex, path: TransShiftMex/mexLibrary.cpp, lines: [367, 369], hl: [368], expect: "audapter.reset();", note: "The MEX 'reset' action calls it directly, whether or not audio is running."}
    - {repo: blab-matlab, path: mcode/UIRecorder.m, lines: [1090, 1092], hl: [1092], expect: "AudapterIO('reset');", note: "The always-on caller: every trial start while audio runs."}
  upstream_refs:
    - {repo: upstream-mex, path: TransShiftMex/Audapter.cpp, lines: [506, 506], expect: "downSampFilter.reset();"}
  fix: >
    Put one mutex around every MEX action that touches Audapter state; the callback <code>try_lock</code>s it and outputs silence (or the
    previous frame) when it is busy. Alternatively, have <code>reset</code> set a flag that the callback acts on at the next frame boundary.
