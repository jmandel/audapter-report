id: LIVE-3
log: LIVE-3
notes: "live/README.md#live-3"
headline: "reset() while the participant is voicing can send a clipped burst, 17 dB above the loudest speech sample, to the headphones"
severity: med
origin: upstream
origin_note: "Inherited: upstream 2.1.5 has the same unlocked reset() and the same resampling-filter reset (Audapter.cpp:506 there). Known from reading both trees; the simulation ran the blab build only."
fidelity: "Simulation, not a Windows rig: the real mexFunction, audioIO.cpp and RtAudio ASIO code, built with GCC on Linux, driven by a software fake ASIO driver in docker. The burst mechanism is real code; its rate depends on thread scheduling and MATLAB's per-call overhead, so the rate is indicative, not what a Windows machine would show."
status: [D]
effect:
  setup: >
    The <code>ALWAYS_ON</code> pattern: audio keeps running and <code>AudapterIO('reset')</code> is called while it runs, as
    <code>UIRecorder.m</code> does at every trial start when <code>bAlwaysOn</code> is set. In the simulation a looped synthetic vowel plays
    into Audapter's F1-shift configuration (the real <code>AudapterIO('init')</code> parameter trace, an OST and a PCF). A MATLAB-side stand-in
    calls <code>reset</code> about every 62 ms (a 50 ms pause after each ~12 ms call) for 120 s. The fake driver uses float64 samples so that
    true peaks above full scale can be measured. The clips are cut from that run at the 48 kHz device rate.
  expected: "reset() clears Audapter's buffers, so the output drops out for a few ms and then resumes at the usual level. The race-free control (the same resets done between offline runFrame calls) never exceeds {control_peak:.3f}, the normal peak."
  observed: "{n_resets} resets, {n_resets_voiced} of them during voicing. After one of them the output jumped to {burst_peak:.2f} × digital full scale, {burst_peak_db_re_normal:+.1f} dB above the loudest normal output sample, for {burst_ms:.1f} ms; {clipped_samples} samples lie beyond full scale and a DAC clips them. The other resets during voicing produced only the {dropout_ms_median:.0f} ms dropout."
  matters: >
    A sudden full-scale click in the headphones is unpleasant, can startle the participant, and at the raised playback levels of feedback
    experiments it is uncomfortably loud. It lands at a trial start, when the participant may already be speaking. No error or warning is raised.
    The same missing lock also lets <code>reset</code> occasionally corrupt the new trial's frame clock (a zeroed first data row; see the numbers
    below), and ThreadSanitizer lists many distinct racing code-site pairs between the MATLAB thread and the callback. The default per-trial <code>start</code>/<code>stop</code> flow is not affected.
    <br><strong>Fidelity.</strong> Simulation, not a Windows rig: the real MEX, <code>audioIO.cpp</code> and RtAudio ASIO code, built with GCC on Linux,
    driven by a fake ASIO driver in docker. The mechanism is the real code; the rate (1 burst in this 120 s run) depends on scheduling and is indicative only.
  numbers:
    - ["Resets while audio ran / during voicing", "{n_resets} / {n_resets_voiced} in {run_s:.0f} s"]
    - ["Bursts above 2 × the normal peak", "{n_bursts} ({burst_rate_voiced} resets during voicing)"]
    - ["Normal output peak (no resets) / race-free control", "{ref_peak:.3f} / {control_peak:.3f}"]
    - ["Burst true peak", "{burst_peak:.3f} × full scale = {burst_peak_dbfs:+.1f} dBFS, {burst_peak_db_re_normal:+.1f} dB re normal peak"]
    - ["Burst length above the normal peak / above 2 ×", "{burst_ms:.1f} ms / {burst_ms_above_2x:.1f} ms"]
    - ["Samples beyond full scale", "{clipped_samples} ({clipped_ms:.2f} ms)"]
    - ["Output dropout after an ordinary reset (median)", "{dropout_ms_median:.0f} ms"]
    - ["Burst in the run / comparison reset", "{burst_at_s:.3f} s / {match_at_s:.3f} s (same point of the vowel ± {match_phase_offset_ms:.0f} ms)"]
    - ["Always-on trial starts with a corrupted first data row", "{rc_bad_first} of {rc_n}"]
    - ["ThreadSanitizer, all live scenarios", "{tsan_reports} reports, {tsan_pairs} distinct site pairs"]
