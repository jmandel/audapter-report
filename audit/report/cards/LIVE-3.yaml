# Full finding card LIVE-3. Sections follow the fixed template (build.py REQUIRED).
id: LIVE-3
log: LIVE-3
notes: live/README.md#live-3
headline: reset() while the participant is speaking can send a loud, clipped click to the headphones
severity: med
reach_kind: pitfall
reach: >-
  Not triggered by blab's per-trial flow, which calls reset() while audio is stopped. Affects designs that call reset() with audio running while the participant may be speaking.
settings:
  source: Hypothetical always-on design, simulated on the live audio path.
  override:
    params: {}
    switching: reset() about every 62 ms for 120 s while audio runs
    input: a looped vowel
  playground: false
  playground_why: this needs the live audio path.
origin: upstream
status:
- D
what: >-
  <code>Audapter('reset')</code> runs on the MATLAB thread while the audio callback may be filtering a frame. It clears the resampling filters' state in the middle
  of that frame, and the filter can then ring for a few milliseconds far above the speech level. The output is clipped at the sound card, so the participant hears
  a click.
scope: >-
  Affects designs that keep audio running across trials and call <code>reset</code> while the participant may be voicing, such as always-on designs that reset at
  each trial start. It happens on roughly 1 in 1000–2000 resets during voicing. The size varies from run to run; the observed range is +17 to +61 dB above the loudest
  normal output sample. The usual start–stop–reset flow per trial is not affected. These numbers come from a simulation of the live path (the real audio code, built
  with GCC on Linux, with a modelled ASIO driver), so rates are indicative.
example: >-
  A looped vowel with <code>reset</code> called about every 62 ms for 120 s: {n_resets} resets, {n_resets_voiced} of them during voicing. One produced a burst of
  {burst_peak_db_re_normal:+.1f} dB above the normal peak, {burst_ms:.1f} ms long, with {clipped_samples} samples beyond full scale. Every other reset during voicing
  produced only a {dropout_ms_median:.0f} ms dropout.
figure_caption: >-
  Output around the reset that raced the callback, and around another reset at the same point of the vowel; time relative to the reset.
table:
- - live simulation
  - Resets during voicing / bursts, this run
  - '{n_resets_voiced} / {n_bursts}'
- - live simulation
  - Burst peak re the loudest normal sample, this run
  - '{burst_peak_db_re_normal:+.1f} dB'
- - live simulation
  - Burst peak over three independent runs
  - +17 to +61 dB
- - live simulation
  - Rate over three runs
  - about 1 in 1000–2000 resets during voicing
- - live simulation
  - Output after an ordinary reset during voicing
  - '{dropout_ms_median:.0f} ms dropout'
sketch: live3
asset_dir: live-3
audio:
- file: input_vowel.wav
  role: input
  label: 'Input: the looped vowel around the reset'
- file: output_reset_no_burst.wav
  role: expected
  label: 'Output around another reset at the same point of the vowel: no click'
- file: output_reset_burst.wav
  role: observed
  label: Output around the reset that raced the callback
  warn: Loud click. Turn the volume down first.
audio_note: >-
  The clips share one playback gain, set so the burst clip peaks at −1 dBFS; the other clips play at their true level relative to it, so the speech is quiet. 48 kHz,
  as it reaches the sound card, clipped at full scale.
  Synthetic only: the live-path simulation was run with this vowel; re-running it needs the live rig simulation, not the offline harness.
cause:
  summary: >-
    Nothing serialises <code>reset()</code> with the audio callback. <code>reset()</code> zeroes the 48 ↔ 16 kHz resampling filters' delay lines while the callback
    may be inside <code>IIR_Filter::filter</code>; the remaining state no longer cancels and the high-order filter rings.
  refs:
  - repo: blab-mex
    path: TransShiftMex/Audapter.cpp
    lines:
    - 522
    - 538
    hl:
    - 537
    - 538
    expect: upSampFilter.reset();
    note: >-
      reset() zeroes the resampling filter states. Nothing stops the callback from running at the same time.
  - repo: blab-mex
    path: TransShiftMex/filter.h
    lines:
    - 42
    - 46
    hl:
    - 44
    expect: delay[i] = 0.0;
    note: The reset clears the delay line element by element...
  - repo: blab-mex
    path: TransShiftMex/filter.h
    lines:
    - 59
    - 65
    hl:
    - 60
    - 62
    expect: delay[k] = g * b[k + 1] * x[m] + delay[k + 1] - a[k + 1] * y[m];
    note: '...while the callback''s filter loop reads and writes the same delay line for every sample.'
  - repo: blab-mex
    path: TransShiftMex/Audapter.cpp
    lines:
    - 608
    - 611
    hl:
    - 609
    - 611
    expect: data_counter=0;
    note: >-
      The frame counters are cleared last. A callback between the two counter increments leaves the new trial with an offset frame clock.
  - repo: blab-mex
    path: TransShiftMex/mexLibrary.cpp
    lines:
    - 367
    - 369
    hl:
    - 368
    expect: audapter.reset();
    note: The MEX 'reset' action calls it directly, whether or not audio is running.
  - repo: blab-matlab
    path: mcode/UIRecorder.m
    lines:
    - 1090
    - 1092
    hl:
    - 1092
    expect: AudapterIO('reset');
    note: 'The always-on caller: every trial start while audio runs.'
  fix: >-
    Put one lock around every MEX action that changes Audapter state; the callback tries the lock and outputs silence if it is busy. Or have <code>reset</code> set
    a flag that the callback acts on at the next frame. Workaround: stop audio before <code>reset</code>, or reset only while the participant is silent.
verify:
- kind: D
  what: live simulation driver (fake ASIO, float64 samples)
  name: live/run.sh burst
  detail: >-
    1 burst in 1945 resets in the run shown; independent reproductions: 2 in 1901 (+42.9, +48.8 dB) and 1 in 1955 (+61.1 dB); race-free control max 0.171
- kind: D
  what: live simulation driver
  name: live/run.sh resetcheck
  detail: 1 of 1000 always-on trial starts with a zeroed first data row
- kind: D
  what: ThreadSanitizer inventory
  name: live/run.sh tsan
  detail: 356 reports, 195 distinct site pairs; reset ↔ IIR_Filter::filter among them
- kind: D
  what: report export (burst, dropouts, comparison reset, clips)
  name: report/live/export_live.py live3
  detail: checks its excerpt against results/reset_race_burst.wav
reproduce: audit/live/run.sh burst && python3 audit/report/live/export_live.py live3
fidelity: >-
  Simulation, not a Windows rig: the real mexFunction, audioIO.cpp and RtAudio ASIO code, built with GCC on Linux, driven by a software fake ASIO driver in docker.
  The burst mechanism is real code; its rate depends on thread scheduling and MATLAB's per-call overhead, so the rate is indicative, not what a Windows machine would
  show.
