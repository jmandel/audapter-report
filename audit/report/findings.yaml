# Structured report data (cards live in cards/<ID>.yaml) for the HTML report. build.py renders this; nothing in index.html is hand-edited.
# Every `log:` id must exist in ../FINDINGS-LOG.md (build.py checks). Every code ref is excerpted from the
# pinned SHA with `git show`, and its `expect:` text must appear in the excerpt (guards against line drift).

report:
  title: "Does Audapter do what experimenters think it does? An audit of the blab-lab version"
  date: "2026-09-27"
  # public repo holding audit/ (notes, harness, patches); links to audit files point here
  repo_url: "https://github.com/jmandel/audapter-report/blob/main"
  targets:
    - {repo: blab-mex, label: "blab-lab/audapter_mex"}
    - {repo: blab-matlab, label: "blab-lab/audapter_matlab"}
    - {repo: upstream-mex, label: "shanqing-cai/audapter_mex 2.1.5 (baseline)"}

repos:
  blab-mex:     {url: "https://github.com/blab-lab/audapter_mex",     sha: "169cadffef4c2d82a33939b840245b8a8a9db0de", local: "blab/audapter_mex"}
  blab-matlab:  {url: "https://github.com/blab-lab/audapter_matlab",  sha: "e1695f146a0ecc3014ffe34b2b3cbc578edcd4b2", local: "blab/audapter_matlab"}
  upstream-mex: {url: "https://github.com/shanqing-cai/audapter_mex", sha: "f547196483fd2e68ef33f8a6fa7ed532eefd5af5", local: "upstream/audapter_mex"}
  vsaCentralize: {url: "https://github.com/blab-lab/vsaCentralize", sha: "9beb9a7767418cae5d681b35fb1e0cc010331d02", local: "other/blab-experiments/vsaCentralize", who: "blab-lab/vsaCentralize"}
  vsaGeneralize: {url: "https://github.com/blab-lab/vsaGeneralize", sha: "0ec575ae1cde8402628b6cb5cd756467a95dd11d", local: "other/blab-experiments/vsaGeneralize", who: "blab-lab/vsaGeneralize"}
  vsaSentence: {url: "https://github.com/blab-lab/vsaSentence", sha: "c01942f1381237fd8c205e06e7c1472d72e4e685", local: "other/blab-experiments/vsaSentence", who: "blab-lab/vsaSentence"}
  free-speech: {url: "https://github.com/carrien/free-speech", sha: "ec961b7a04a79199217f4973effda9157afcdf9d", local: "other/blab-experiments/free-speech", who: "carrien/free-speech"}

# Findings at a glance: one row per full card (text shown in the grouped table). Severity = realistic reach x impact.
table:
  - {id: I-01,   sev: high, origin: blab-amplified, status: H, text: "Since b2.4 (April 2026), in runners that load the noise once per session, masking noise drops out for 16 ms every 10 s of trial time"}
  - {id: PT-5,   sev: high, origin: upstream, status: H F, text: "The phase vocoder plays the voice 3.5 dB loud at 0 st (6 dB at timeAdapt settings) unless a warp section is loaded: a loudness step when a design switches it on or drops warp rows"}
  - {id: F6,     sev: med,  origin: blab, status: H, text: "Undocumented blab change that vsaSentence depends on: the field perturbation re-arms on every vowel; minVowelLen has no effect"}
  - {id: LAB-1, sev: low, origin: blab, status: H, text: "Repository note: vsaCentralize ships an unused public runner that looks up the field on the wrong grid; the runner the experiment calls is correct"}
  - {id: LAB-2, sev: med, origin: blab, status: H, text: "Open question: as committed, the public vsaGeneralize runner (called by its experiment script) perturbs baseline trials and never scales the field; vsaGeneralize2 is wired correctly"}
  - {id: LAB-3, sev: low, origin: blab, status: H, text: "Dead line: vsaGeneralize sets p.fb4Gain, which AudapterIO never forwards; the noise plays at the default level, as in every blab fb 4 study (already noted in the lab's code)"}
  - {id: OST-F1, sev: high, origin: upstream, status: H F, text: "With FALL after ELAPSED_TIME, the RMS-floor rule or a ratio rule, the detected offset creeps later every trial and jumps after long ones; perturbations run into the next word"}
  - {id: COORD-1, sev: med, origin: upstream, status: H, text: "A PCF from an earlier block survives AudapterIO('init') and overrides a later field experiment; blab's runners clear it"}
  - {id: OST-F5, sev: med,  origin: upstream, status: H R, text: "Pitch catch trials made by clearing the PCF get the full shift when the previous trial ended while shifted"}
  - {id: OST-F2, sev: med,  origin: upstream, status: H F, text: "maxIOI timeout: the next ELAPSED_TIME lasts one frame, and without an OST reload the timeout drifts 0.2 s later per trial"}
  - {id: CORPUS-8, sev: med, origin: upstream, status: H, text: "Time-domain pitch tracking at the default frame settings logs pitch wrongly below about 140 Hz (typical adult men)"}
  - {id: CORPUS-10, sev: med, origin: upstream, status: H, text: "Changing frameLen/nDelay at a fixed sample rate within a session can hang runFrame (and the audio callback) at 100 % CPU"}
  - {id: LIVE-1 / LIVE-2, sev: med, origin: upstream, status: D, text: "Loading OST/PCF files or changing DSP parameters while audio runs (always-on designs) crashes MATLAB or reads freed memory"}
  - {id: LIVE-3, sev: med, origin: upstream, status: D, text: "reset() while the participant is speaking can send a clipped click: +17 to +61 dB, about 1 in 1000–2000 resets during voicing"}
  - {id: LIVE-6, sev: med, origin: upstream, status: D, text: "If the sound card's buffer size differs from Audapter's frame size, the participant hears the raw microphone an octave up, with gaps"}
  - {id: CORPUS-11, sev: med, origin: upstream, status: H, text: "Shifted formant targets are unbounded: old mel-unit parameters under today's ratio default give targets up to 130 kHz and clipped output"}
  - {id: I-04,   sev: low,  origin: upstream, status: H, text: "runFrame writes its output into the caller's input array, so reprocessing the same frames feeds processed audio back in"}
  - {id: I-02,   sev: low,  origin: blab, status: H, text: "fb mode 5 applies dScale twice to the speech-modulated component"}
  - {id: I-03,   sev: low,  origin: upstream, status: H, text: "The recorder wraps after 30 s without warning; a 35 s trial returns only its last 5 s"}
  - {id: OST-F8, sev: low,  origin: blab, status: H, text: "AND_RATIO OST rules take the hold from field 5, where the manual puts {}"}
  - {id: OST-F4, sev: med,  origin: upstream, status: H, text: "A PCF with fewer rows than OST states reads past its arrays; heap contents decide whether to perturb"}
  - {id: FMT-F1, sev: med,  origin: blab, status: H, text: "Clamp trajectory setters copy 2048 values whatever length MATLAB passes"}

# Report sections, in order. Each lists its full cards and short cards; compact rows carry `section:` (default pitfalls).
sections:
  - id: current
    title: "What affects blab's current experiments"
    lead: >-
      <p>These findings touch experiments the lab runs now, with the lab's own settings. The first is a defect introduced with
      b2.4 in April 2026; the second is a blab change that one of the lab's designs depends on.</p>
    cards: [I-01, F6]
    short: [FMT-F3, CORPUS-7]
    short_title: "Also relevant to current experiments (small effects)"
  - id: labscripts
    title: "Questions for the lab, from the public experiment code"
    lead: file:sec_labscripts.html
    cards: [LAB-1, LAB-2, LAB-3]
  - id: carryover
    title: "Trial-to-trial carry-over in mixed designs"
    lead: file:sec_carryover.html
    cards: [OST-F1, COORD-1, OST-F5, OST-F2]
  - id: pitfalls
    title: "Pitfalls for future designs"
    lead: >-
      <p>None of these is triggered by the blab designs we inspected. Each can affect a plausible design, so each card states the
      settings that trigger it, the safe pattern, and the fix. Examples use the most plausible settings a lab would choose and are
      marked as hypothetical.</p>
    cards: [PT-5, CORPUS-8, CORPUS-10, LIVE-1 / LIVE-2, LIVE-3, LIVE-6, CORPUS-11, I-04, I-02, I-03, OST-F8]
    short: [PT-2 / I-15, PT-3, PT-4, PT-6, FMT-F4, I-09, CORPUS-3, CORPUS-4, LIVE-4, LIVE-5, LIVE-7, LIVE-8]
    short_title: "Further pitfalls"
  - id: robust
    title: "Robustness"
    lead: >-
      <p>Memory reads and writes past the end of an array, and similar defects that need a malformed file or parameter, or an
      unusual build, to show up. None changes what a participant hears with well-formed settings; each is worth fixing because
      the failure, when it happens, is silent or a crash.</p>
    cards: [OST-F4, FMT-F1]
    short: [H2 / PT-1, I-06 / I-07, OST-F6, COORD-5]
    short_title: "Further robustness items"
    compact_title: "Other robustness items"

intro_found: file:intro_found.html

# Short cards: what happens, when it matters, the code, the fix, how we know.
short:
  - id: H2 / PT-1
    notes: notes/pitch-time.md#pt-1
    sev: low
    origin: upstream
    status: H F
    title: >-
      The first output frame of each trial, and one frame every 108 s, is read from outside the delay buffer
    refs:
    - repo: blab-mex
      path: TransShiftMex/Audapter.cpp
      lines:
      - 2110
      - 2116
      hl:
      - 2111
      expect: p.delayFrames[h0] * p.frameLen > 0
    verify: >-
      UBSan reports the read on every harness run (Audapter.cpp:2124). CBMC on the verbatim source gives the exact conditions and proves both fixes.
    what: >-
      The read position in the output delay ring uses <code>&gt; 0</code> where <code>&gt;= 0</code> is needed. When the write position minus the delay is exactly 0,
      the frame is read past the end of the buffer. The pitch-shift "back zeroing" on the same ring can also write before the start of the buffer.
    scope: >-
      The read happens at frame <code>delayFrames</code> of every trial and once per 108 s lap. At a trial start the wrongly read frame is near-silent, so it is benign;
      in continuous sessions longer than 108 s without a reset it gives a 2 ms glitch. The back-zeroing write happens only with pitch shifting when the write position
      is below <code>delayFrames·frameLen + pvocHop</code>.
    fix: >-
      Use <code>&gt;= 0</code> in the read-pointer test and a positive modulo in the back zeroing; both are proven to stay in bounds for every setting and to address
      the same samples wherever the original was valid.
  - id: PT-2 / I-15
    notes: notes/pitch-time.md#pt-2
    sev: med
    origin: upstream
    status: H
    title: The RMS-clip loudness protection mutes a stale 2 ms slot instead of the loud frame
    refs:
    - repo: blab-mex
      path: TransShiftMex/Audapter.cpp
      lines:
      - 1955
      - 1958
      hl:
      - 1957
      expect: outFrameBuf[n]=0;
    verify: 'Harness (scratch/pitch-time/rmsclip.m): threshold 0.01, a 0.5-amplitude sine; output unchanged.'
    what: >-
      When the frame RMS exceeds <code>rmsClipThresh</code>, the code zeroes the start of the circular output buffer instead of the current frame, so loud output passes
      through unchanged.
    scope: >-
      Matters only for experiments that rely on <code>bRMSClip</code> for participant safety. It is off by default on the MATLAB side, and the MATLAB setters for it
      are commented out, so <code>data.params</code> reports the C++ default (on), not what the experiment script asked for.
    fix: >-
      Zero the frame at <code>outFrameBuf_circPtr</code>, and restore the MATLAB setters. Do not rely on this protection until then.
  - id: PT-3
    notes: notes/pitch-time.md#pt-3
    sev: med
    origin: upstream
    status: H
    title: >-
      The time-domain pitch-shift schedule runs on voiced time only, so shift onsets come later after every pause
    refs:
    - repo: blab-mex
      path: TransShiftMex/Audapter.cpp
      lines:
      - 1896
      - 1902
      hl:
      - 1896
      expect: above_rms && p.bTimeDomainShift
    - repo: blab-mex
      path: TransShiftMex/time_domain_shifter.cpp
      lines:
      - 243
      - 243
      hl:
      - 243
      expect: nowSec = static_cast<dtype>(totalLen) / sr
    verify: Harness (scratch/pitch-time/tdsched.m).
    what: >-
      The time-domain shifter's schedule clock advances only on frames above the RMS threshold. A schedule written in trial time runs late by the total time spent below
      threshold, and frames below threshold pass through unshifted.
    scope: >-
      Affects time-domain pitch shifting with a time-varying schedule on speech with pauses. A 168 ms dip below threshold moved a 1.04 s onset to 1.20 s.
    fix: Advance the schedule clock on every frame, or document that the schedule is in voiced time.
  - id: PT-4
    notes: notes/pitch-time.md#pt-4
    sev: med
    origin: upstream
    status: H
    title: The logged pitchShiftRatio is wrong whenever the time-domain shifter is used
    refs:
    - repo: blab-mex
      path: TransShiftMex/Audapter.cpp
      lines:
      - 2096
      - 2097
      hl:
      - 2097
      expect: data_recorder[offs][data_counter] = p.pitchShiftRatio[0];
    verify: 'Harness: the logged column during a scheduled +100 cent shift.'
    what: >-
      The <code>pitchShiftRatio</code> data column logs <code>p.pitchShiftRatio[0]</code>, which the time-domain shifter does not use; it follows its own schedule.
      During a +100 cent time-domain shift the log says 1.0.
    scope: >-
      Affects every analysis that reads the logged ratio from time-domain pitch-shift sessions. With a PCF loaded, the PCF's pitch values are logged although the shifter
      ignores them.
    fix: Log the ratio the shifter actually applies.
  - id: PT-6
    notes: notes/pitch-time.md#pt-6
    sev: med
    origin: upstream
    status: R
    title: A PCF with both a pitch shift and a time warp silently drops the warp
    refs:
    - repo: blab-mex
      path: TransShiftMex/Audapter.cpp
      lines:
      - 3195
      - 3203
      hl:
      - 3201
      expect: pertCfg.warpCfg.size() > 0 && !bIsPitchShift
    verify: By reading.
    what: >-
      When a PCF specifies both a pitch shift and a time warp, the phase vocoder is set to pitch-shift-only: the mode that combines both cannot be reached, because
      its condition repeats another branch's.
    scope: Affects PCFs that combine pitch shift and time warp. The warp is not applied and nothing warns.
    fix: Change the third condition to <code>warp &gt; 0 &amp;&amp; bIsPitchShift</code>.
  - id: OST-F6
    notes: notes/ost-pcf.md#f6
    sev: med
    origin: upstream
    status: D
    title: Reloading an OST file that has no maxIOI section crashes MATLAB
    refs:
    - repo: blab-mex
      path: TransShiftMex/ost.cpp
      lines:
      - 261
      - 262
      hl:
      - 262
      expect: if (++lit == ostLines_1.end())
    - repo: blab-mex
      path: TransShiftMex/ost.cpp
      lines:
      - 723
      - 725
      hl:
      - 725
      expect: maxIOICfg.stat0[i]
    verify: 'Standalone ost.cpp driver (scratch/ost-pcf/t): segfault on the first frame after the reload.'
    what: >-
      Loading a new OST frees the maxIOI arrays. If the new file has no maxIOI section, the parser returns without setting their count to 0, and the next frame dereferences
      the freed arrays.
    scope: >-
      Affects sessions that load one OST with a maxIOI section and then one without; <code>gen_multi_pert_pcf.m</code> writes files without it.
    fix: >-
      Set <code>maxIOICfg.n = 0</code> before returning. Workaround: always end OST files with an <code>n = 0</code> maxIOI section.
  - id: I-06 / I-07
    notes: notes/interface.md#i-06
    sev: med
    origin: upstream
    status: H
    title: An oversized tone count is accepted and overwrites neighbouring parameters
    refs:
    - repo: blab-mex
      path: TransShiftMex/Audapter.cpp
      lines:
      - 855
      - 865
      hl:
      - 858
      - 860
      expect: ptr = (void *)&p.tsgNTones;
    verify: Harness (scratch/interface/t_iface.m T5) for the check order; the overflow by reading.
    what: >-
      The <code>tsgNTones</code> range check reads the value before it is assigned, so 100 is accepted although the maximum is 64. The next tone-sequence setter then
      writes past the tone arrays into neighbouring parameters (stereoMode, bShift2D, clamp settings). The tone-sequence recorder also has no bound and overruns after
      10 s.
    scope: Affects scripts that set more than 64 tones or play tone sequences longer than 10 s.
    fix: Check the new value, not the old one, and bound the recorder.
  - id: FMT-F3
    bs: affected
    notes: notes/formant.md#f3
    sev: med
    origin: blab
    status: R
    title: The 2D perturbation field uses the lower-left grid cell, not interpolation
    refs:
    - repo: blab-mex
      path: TransShiftMex/Audapter.cpp
      lines:
      - 1845
      - 1848
      hl:
      - 1846
      - 1847
      expect: p.pertAmp2D[locintf1][locintf2]
    verify: By reading.
    what: >-
      The 2D field lookup rounds both grid positions down and ignores the fractional part, although the comments say linear interpolation. The perturbation is piecewise
      constant, biased by up to one grid step toward lower F1/F2, and the last row and column are never used.
    scope: >-
      Affects 2D-field experiments whose fields change noticeably between grid points. Rows are F1 and columns F2 consistently.
    fix: Interpolate bilinearly, or document the nearest-lower-cell rule.
  - id: FMT-F4
    notes: notes/formant.md#f4
    sev: med
    origin: blab
    status: R
    title: Clamped formants are logged during silence, where no filtering happened
    refs:
    - repo: blab-mex
      path: TransShiftMex/Audapter.cpp
      lines:
      - 1814
      - 1819
      hl:
      - 1814
      - 1817
      expect: p.bClampFormants && stat >= p.clamp_osts[0]
    verify: By reading.
    what: >-
      The clamp branch turns the perturbation on without checking that the frame is voiced. The logged <code>sfmts</code> show clamp targets in silent and unvoiced
      frames where the formant filter did not run, and the clamp trajectory advances through silence.
    scope: >-
      Affects clamped-formant experiments; analyses that read <code>sfmts</code> as "what was applied" count silent frames.
    fix: >-
      Check <code>above_rms</code> in the clamp branch, and advance the trajectory only on voiced frames if that is the intent.
  - id: I-09
    notes: notes/interface.md#i-09
    sev: med
    origin: upstream
    status: R
    title: Changing ndelay, frameLen or nWin does not rebuild the formant tracker
    refs:
    - repo: blab-mex
      path: TransShiftMex/Audapter.cpp
      lines:
      - 758
      - 770
      hl:
      - 765
      - 768
      expect: ns == string("ndelay")
    verify: By reading; see CORPUS-10 for a consequence.
    what: These setters do not mark the formant tracker for rebuilding, so it keeps its old analysis window.
    scope: >-
      <code>AudapterIO('init')</code> usually also changes fn1/fn2, which triggers a rebuild, but a direct <code>Audapter(3, 'ndelay', …)</code> leaves a stale window,
      and in one real case a stale tracker caused a hang (CORPUS-10).
    fix: Set <code>bRemakeFmtTracker</code> in these setters.
  - id: CORPUS-3
    notes: notes/corpus.md#corpus-3
    sev: med
    origin: upstream
    status: H
    title: 'There is no preset for young children: the female preset underestimates their F2 by about 12 %'
    refs:
    - repo: blab-matlab
      path: mcode/getAudapterDefaultParams.m
      lines:
      - 3
      - 12
      hl:
      - 4
      - 8
      expect: p.nLPC          = 15;
    verify: >-
      Harness on 8 real child recordings (harness/oct/corpus_track.m, nLPC sweep); reference = frames where Praat and an independent LPC agree.
    what: >-
      For 6–7-year-old children the female preset (<code>nLPC 15</code>) tracks F2 11.9 % low on average, with gross errors on 18 % of frames. With <code>nLPC 11</code>
      the error is 1.7–2.0 %.
    scope: >-
      Affects formant experiments with young children (F0 above about 220 Hz); a field or shift indexed by F2 is applied at the wrong place in the vowel space. Children
      aged 10–12 are tracked well with the female preset.
    fix: >-
      Add a child preset with nLPC 11, or document the choice. Workaround: set nLPC to 11 for young children.
  - id: CORPUS-4
    notes: notes/corpus.md#corpus-4
    sev: low
    origin: upstream
    status: H
    title: The male preset can report F3 as F2 for a whole vowel
    refs:
    - repo: blab-matlab
      path: mcode/getAudapterDefaultParams.m
      lines:
      - 3
      - 4
      hl:
      - 4
      expect: p.nLPC          = 17;
    verify: Harness on real speech (harness/oct/corpus_track.m).
    what: >-
      On a sustained /a/ with F2 near 1000 Hz, the male preset (<code>nLPC 17</code>) logged F2 at 2494 Hz on every frame; <code>nLPC 15</code> tracked it correctly.
    scope: Seen on 1 of 4 male /a/ tokens. Any F2-indexed field or F2 shift is then computed from F3.
    fix: >-
      Check tracked formants against the expected vowel space during setup. Workaround: try nLPC 15 for male speakers with low F2.
  - id: CORPUS-7
    bs: affected
    notes: notes/corpus.md#corpus-7
    sev: low
    origin: upstream
    status: H
    title: 'With pitch shifting on, low frequencies are boosted more than the rest: +7 dB at 30 Hz'
    refs:
    - repo: blab-mex
      path: TransShiftMex/phase_vocoder.cpp
      lines:
      - 218
      - 220
      hl:
      - 219
      expect: X_magn[i] = 2.0
    verify: 'Harness (harness/oct/corpus_pvoc_lf.m): a sine sweep and a real noisy recording.'
    what: >-
      At 0 semitones the phase vocoder adds +3.5 dB above 150 Hz (PT-5) and more below: +3.6 dB at 100 Hz, +4.0 at 80, +5.7 at 50 and +7.0 dB at 30 Hz.
    scope: >-
      Affects pitch-shift sessions in rooms with low-frequency noise: in a recording with bus noise, the noise gained +7.4 dB against +3.6 dB for the speech, so the
      noise is about 4 dB louder relative to the voice at the ear.
    fix: >-
      Halve the magnitude of the lowest bin in the phase vocoder, as the formal analysis of the gain shows.

# Other findings: one row each (low severity or narrow conditions). loc = file:line at the pinned blab SHA.
  - id: COORD-5
    notes: notes/pitch-time.md
    sev: low
    origin: upstream
    status: H R
    title: >-
      A rejected time-warp row terminates the process on Linux, macOS and WebAssembly builds (portability)
    refs:
    - repo: blab-mex
      path: TransShiftMex/pcf.cpp
      lines: [265, 280]
      hl: [267, 279]
      expect: throw(overlappingWarpIntervalsError)
    verify: >-
      Harness: a PCF warp row with rate 1 (a "null warp") terminated Octave on Linux; reading of the exception specification.
    what: >-
      <code>PERT_CFG::addWarpCfg</code> declares that it throws only <code>overlappingWarpIntervalsError</code>, but it also throws
      <code>warpCfgInitError</code> when a warp rate is outside its range (rate1 not in (0, 1), or rate2 not above 1). GCC and clang
      enforce the declaration and terminate the process; MSVC ignores it, so on the lab's Windows rigs MATLAB reports
      "Failed to initialize time-warping event" instead.
    scope: >-
      Not a crash on Windows. It matters for Linux, macOS and browser builds, and for anyone who writes a rate-1 warp row to mean
      "no warp": that row is rejected rather than treated as a no-op. Use a zero-length warp row instead.
    fix: Drop the dynamic exception specification (it is deprecated since C++11), or declare both exception types.

compact:
  - {id: OST-F3, section: robust, sev: med, origin: upstream, status: H, notes: "notes/ost-pcf.md#f3", loc: "TransShiftMex/ost.cpp:360-365", text: "stat0[i+1] is read past the end on every frame once the last rule is reached; harmless with a trailing OST_END, a silent behaviour change without one"}
  - {id: OST-F7, section: robust, sev: med, origin: upstream, status: D, notes: "notes/ost-pcf.md#f7", loc: "TransShiftMex/ost.cpp:256", text: "Sparse or mis-numbered OST states write past statOnsetIndices (sized 4·n); state numbers are never range-checked"}
  - {id: OST-F9, sev: med, origin: upstream, status: R, notes: "notes/ost-pcf.md#f9", loc: "TransShiftMex/ost.cpp:531-552", text: "INTENSITY_FALL: the code, its comment and the manual disagree on the rule; the current frame is never examined"}
