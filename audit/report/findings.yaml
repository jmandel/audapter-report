# Structured report data (cards live in cards/<ID>.yaml) for the HTML report. build.py renders this; nothing in index.html is hand-edited.
# Every `log:` id must exist in ../FINDINGS-LOG.md (build.py checks). Every code ref is excerpted from the
# pinned SHA with `git show`, and its `expect:` text must appear in the excerpt (guards against line drift).

report:
  title: "Audapter, blab-lab fork: what a headless audit found"
  date: "2026-09-27"
  # public repo holding audit/ (notes, harness, patches); links to audit files point here
  repo_url: "https://github.com/jmandel/audapter-report/blob/main"
  targets:
    - {repo: blab-mex, label: "blab-lab/audapter_mex"}
    - {repo: blab-matlab, label: "blab-lab/audapter_matlab"}
    - {repo: upstream-mex, label: "shanqing-cai/audapter_mex 2.1.5 (baseline)"}

repos:
  blab-mex:     {url: "https://github.com/blab-lab/audapter_mex",     sha: "169cadffef4c2d82a33939b840245b8a8a9db0de", local: "blab/audapter_mex"}
  blab-matlab:  {url: "https://github.com/blab-lab/audapter_matlab",  sha: "e1695f146a0ecc3014ffe34b2b3cbc578edcd4b2", local: "blab/audapter_matlab"}
  upstream-mex: {url: "https://github.com/shanqing-cai/audapter_mex", sha: "f547196483fd2e68ef33f8a6fa7ed532eefd5af5", local: "upstream/audapter_mex"}

# Findings at a glance: full cards (rows link to the card when cards/<ID>.yaml exists) in rank order.
table:
  - {id: OST-F1, sev: high, origin: upstream, status: H, text: "OST state leaks across trials: an offset in trial B is detected 1.2 s late after a longer trial A"}
  - {id: OST-F2, sev: high, origin: upstream, status: H, text: "maxIOI timeout writes the onset of the wrong state; ELAPSED_TIME fires after 2 ms instead of 100 ms, and without an OST reload the timeout drifts 0.2 → 0.4 → 0.6 s"}
  - {id: I-01,   sev: high, origin: blab-amplified, status: H, text: "Masking noise shorter than 10 s is followed by silence until the 10 s buffer wraps"}
  - {id: OST-F4, sev: high, origin: upstream, status: H, text: "PCF with fewer rows than OST states reads past the perturbation arrays; heap contents decide whether to perturb"}
  - {id: FMT-F1, sev: high, origin: blab, status: H, text: "Clamp trajectory setters copy 2048 values whatever length MATLAB passes"}
  - {id: PT-5,   sev: high, origin: upstream, status: H, text: "Phase vocoder plays 3.5 dB loud at 0 st, and the level changes when a pitch shift starts"}
  - {id: I-04,   sev: med,  origin: upstream, status: H, text: "runFrame writes its output into the caller's input array"}
  - {id: OST-F8, sev: med,  origin: blab, status: H, text: "Blab AND_RATIO rules take the hold from field 5, where the manual puts {}"}
  - {id: I-02,   sev: med,  origin: blab, status: H, text: "fb mode 5 applies dScale twice to the speech-modulated component"}
  - {id: F6,     sev: med,  origin: blab, status: H, text: "Dropout fix re-arms the perturbation on every field re-entry; minVowelLen no longer has any effect"}
  - {id: I-03,   sev: med,  origin: upstream, status: H, text: "Recorder wraps after 30 s without warning; a 35 s trial returns its last 5.2 s"}


# Full cards, in report order (cards/<ID>.yaml)
cards: [OST-F1, I-01, PT-5]

# Short cards: effect, one excerpt at the pinned SHA, how verified. `notes` must name an existing heading.
short:
  - id: H2 / PT-1
    notes: "notes/pitch-time.md#pt-1"
    sev: low
    origin: upstream
    status: H
    title: "The first output frame of every trial, and one frame every 108 s, is read from outside the delay buffer"
    text: >
      The read pointer into the output delay ring uses <code>&gt; 0</code> where <code>&gt;= 0</code> is needed. When the write position minus the
      delay is exactly 0 (the first frame after <code>reset</code> with delayFrames 0, and every wrap of the 108 s ring), the frame is read
      past the end of the voice's buffer: usually zeros, so a silent 2 ms frame; in continuous sessions a glitch every 108 s.
      The pitch-shift "back zeroing" uses a negative <code>%</code> on the same pointer and writes before the buffer.
    refs:
      - {repo: blab-mex, path: TransShiftMex/Audapter.cpp, lines: [2110, 2116], hl: [2111], expect: "p.delayFrames[h0] * p.frameLen > 0"}
    verify: "UBSan on every harness run under build-asan: index 1728000 out of bounds at Audapter.cpp:2124."
  - id: PT-2 / I-15
    notes: "notes/pitch-time.md#pt-2"
    sev: med
    origin: upstream
    status: H
    title: "The RMS-clip loudness protection mutes a stale 2 ms slot instead of the loud frame"
    text: >
      When the frame RMS exceeds <code>rmsClipThresh</code>, the code zeroes <code>outFrameBuf[0 .. frameLen)</code>, the start of the circular buffer,
      not the current frame at <code>outFrameBuf_circPtr</code>. In the harness, output RMS was unchanged with the threshold exceeded. It is off by default
      on the MATLAB side, and blab's MATLAB setters for it are commented out, so <code>data.params</code> reports the C++ default (on), not what the
      experiment script asked for.
    refs:
      - {repo: blab-mex, path: TransShiftMex/Audapter.cpp, lines: [1955, 1958], hl: [1957], expect: "outFrameBuf[n]=0;"}
    verify: "Harness (scratch/pitch-time/rmsclip.m): threshold 0.01, 0.5-amplitude sine, output unchanged."
  - id: PT-3
    notes: "notes/pitch-time.md#pt-3"
    sev: med
    origin: upstream
    status: H
    title: "The time-domain pitch-shift schedule counts only above-threshold time, so onsets drift later after every pause"
    text: >
      The shifter is called only on frames above the RMS threshold, and its clock <code>totalLen</code> advances only inside those calls. A schedule
      written in trial time therefore runs late by the total time spent below threshold: a 168 ms dip moved a 1.04 s onset to 1.20 s.
      Frames below threshold pass through unshifted.
    refs:
      - {repo: blab-mex, path: TransShiftMex/Audapter.cpp, lines: [1896, 1902], hl: [1896], expect: "above_rms && p.bTimeDomainShift"}
      - {repo: blab-mex, path: TransShiftMex/time_domain_shifter.cpp, lines: [243, 243], hl: [243], expect: "nowSec = static_cast<dtype>(totalLen) / sr"}
    verify: "Harness (scratch/pitch-time/tdsched.m)."
  - id: PT-4
    notes: "notes/pitch-time.md#pt-4"
    sev: med
    origin: upstream
    status: H
    title: "The logged pitchShiftRatio is wrong whenever the time-domain shifter is used"
    text: >
      The data column logs <code>p.pitchShiftRatio[0]</code>, which the time-domain shifter never uses (it follows its own schedule). During a
      +100 cent time-domain shift the log says 1.0. With a PCF loaded, the PCF's pitch values are logged although the shifter ignores them.
    refs:
      - {repo: blab-mex, path: TransShiftMex/Audapter.cpp, lines: [2096, 2097], hl: [2097], expect: "data_recorder[offs][data_counter] = p.pitchShiftRatio[0];"}
    verify: "Harness (pitch-time agent): column value during a scheduled shift."
  - id: PT-6
    notes: "notes/pitch-time.md#pt-6"
    sev: med
    origin: upstream
    status: R
    title: "A PCF with both a pitch shift and a time warp silently drops the warp"
    text: >
      The third branch repeats the first branch's condition (<code>warp &gt; 0 &amp;&amp; !bIsPitchShift</code>), so
      <code>TIME_WARP_WITH_FIXED_PITCH_SHIFT</code> is unreachable and "warp plus pitch" falls through to pitch-shift-only.
    refs:
      - {repo: blab-mex, path: TransShiftMex/Audapter.cpp, lines: [3195, 3203], hl: [3201], expect: "pertCfg.warpCfg.size() > 0 && !bIsPitchShift"}
    verify: "By reading."
  - id: OST-F5
    notes: "notes/ost-pcf.md#f5"
    sev: med
    origin: upstream
    status: R
    title: "A PCF pitch shift overwrites the user's pitchShiftRatio, which stays shifted after the PCF is cleared"
    text: >
      With a PCF loaded, every frame writes <code>p.pitchShiftRatio[0] = 2^(pitchShift[stat]/12)</code>. After <code>Audapter('pcf', '', 0)</code> the
      phase vocoder uses the last written value, so a later "no PCF" run is pitch-shifted unless the script sets <code>pitchShiftRatio</code> again,
      and <code>data.params</code> reports the mutated value.
    refs:
      - {repo: blab-mex, path: TransShiftMex/Audapter.cpp, lines: [1970, 1974], hl: [1972], expect: "p.pitchShiftRatio[0] = pow(2.0, pertCfg.pitchShift[stat] / 12.0);"}
    verify: "By reading; a harness test is proposed in the notes."
  - id: OST-F6
    notes: "notes/ost-pcf.md#f6"
    sev: med
    origin: upstream
    status: D
    title: "Reloading an OST file that has no maxIOI section crashes MATLAB in the audio callback"
    text: >
      Loading a new OST frees the maxIOI arrays, but when the new file has no trailing <code>n = ...</code> section the parser returns early without
      setting <code>maxIOICfg.n = 0</code>. The next frame dereferences the freed (NULL) arrays. <code>gen_multi_pert_pcf.m</code> writes files like this.
    refs:
      - {repo: blab-mex, path: TransShiftMex/ost.cpp, lines: [261, 262], hl: [262], expect: "if (++lit == ostLines_1.end())"}
      - {repo: blab-mex, path: TransShiftMex/ost.cpp, lines: [723, 725], hl: [725], expect: "maxIOICfg.stat0[i]"}
    verify: "Standalone ost.cpp driver (scratch/ost-pcf/t): segfault on the first osTrack call after the reload."
  - id: I-06 / I-07
    notes: "notes/interface.md#i-06"
    sev: med
    origin: upstream
    status: H
    title: "An oversized tone count is accepted and overwrites neighbouring parameters"
    text: >
      The <code>tsgNTones</code> range check reads the value <em>before</em> it is assigned, so 100 is accepted (maximum 64) and the next tone-sequence
      setter writes past the tone arrays into neighbouring members of <code>p</code> (stereoMode, bShift2D, clamp settings). Separately, the tone-sequence
      recorder <code>tsg_wf</code> has no bound and overruns after 10 s.
    refs:
      - {repo: blab-mex, path: TransShiftMex/Audapter.cpp, lines: [855, 865], hl: [858, 860], expect: "ptr = (void *)&p.tsgNTones;"}
    verify: "Harness (scratch/interface/t_iface.m T5) for the check order; the overflow by reading."
  - id: FMT-F3
    notes: "notes/formant.md#f3"
    sev: med
    origin: blab
    status: R
    title: "The 2D perturbation field uses the lower-left grid cell, not interpolation"
    text: >
      The comments say linear interpolation, but the 2D lookup takes <code>floor</code> of both grid positions and ignores the fractional parts, so the
      perturbation is piecewise constant and biased by up to one grid step toward lower F1/F2; the last row and column are never used. Rows are F1 and
      columns F2, consistently (no transposition bug).
    refs:
      - {repo: blab-mex, path: TransShiftMex/Audapter.cpp, lines: [1845, 1848], hl: [1846, 1847], expect: "p.pertAmp2D[locintf1][locintf2]"}
    verify: "By reading."
  - id: FMT-F4
    notes: "notes/formant.md#f4"
    sev: med
    origin: blab
    status: R
    title: "Clamped formants are logged during silence, where no filtering happened"
    text: >
      The blab clamp branch sets <code>during_trans</code> without checking <code>above_rms</code>. Logged <code>sfmts</code> then show clamp targets in
      silent and unvoiced frames where the formant filter did not run, and the clamp trajectory index advances through silence.
    refs:
      - {repo: blab-mex, path: TransShiftMex/Audapter.cpp, lines: [1814, 1819], hl: [1814, 1817], expect: "p.bClampFormants && stat >= p.clamp_osts[0]"}
    verify: "By reading."
  - id: I-09
    notes: "notes/interface.md#i-09"
    sev: med
    origin: upstream
    status: R
    title: "Changing ndelay, frameLen or nWin does not rebuild the formant tracker"
    text: >
      These setters do not set <code>bRemakeFmtTracker</code>, so the tracker keeps its old analysis window length. <code>AudapterIO('init')</code> works only
      because fn1/fn2 also change there and trigger a rebuild; a direct <code>Audapter(3, 'ndelay', …)</code> leaves a stale window.
    refs:
      - {repo: blab-mex, path: TransShiftMex/Audapter.cpp, lines: [758, 770], hl: [765, 768], expect: "ns == string(\"ndelay\")"}
    verify: "By reading."

