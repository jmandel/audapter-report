# Live-path short cards, merged into findings.yaml's short list by build.py.
- id: LIVE-4
  notes: live/README.md#live-4
  sev: med
  origin: upstream
  status: D
  title: Audapter('start') reports success when the sound card failed to open
  refs:
  - repo: blab-mex
    path: TransShiftMex/mexLibrary.cpp
    lines:
    - 230
    - 238
    hl:
    - 233
    - 238
    expect: audio_obj.startdev();
  - repo: blab-mex
    path: audioIO/audioIO.cpp
    lines:
    - 96
    - 100
    hl:
    - 97
    - 99
    expect: error.printMessage();
  verify: >-
    Live simulation (live/run.sh startfail): a driver without 48 kHz; start OK, 0 callbacks, getData 1 × 1.
  what: >-
    <code>Audapter('start')</code> ignores the return value of the device open and marks audio as started. With a device that cannot run at 48 kHz, <code>start</code>
    returns normally, no audio flows, and <code>getData</code> returns a 1 × 1 result.
  scope: >-
    Affects rigs where the driver rejects the sample rate, buffer or format. The error text goes to stdout, which on Windows is not the MATLAB command window. The
    playback and tone actions behave the same.
  fix: Return the open result and raise a MATLAB error on failure.
- id: LIVE-5
  notes: live/README.md#live-5
  sev: med
  origin: upstream
  status: D
  title: >-
    With no ASIO driver installed, the first Audapter call of any kind crashes, even for offline processing
  refs:
  - repo: blab-mex
    path: audioIO/audioIO.cpp
    lines:
    - 21
    - 27
    hl:
    - 25
    - 27
    expect: int num_devices = audio->getDeviceCount();
  - repo: blab-mex
    path: TransShiftMex/mexLibrary.cpp
    lines:
    - 84
    - 85
    hl:
    - 85
    expect: static audioIO audio_obj;
  verify: >-
    Live simulation, AddressSanitizer build (live/run.sh noasio): SEGV in RtAudio::getDeviceCount() called from audioIO.cpp:27.
  what: >-
    The audio object inside the MEX is built on the first call of any action. When no audio device exists, its constructor catches the error and then calls a method
    on a NULL pointer.
  scope: >-
    Affects analysis machines without an audio interface: offline reprocessing with <code>runFrame</code> crashes MATLAB at the first <code>AudapterIO('init')</code>.
  fix: Create the audio object only when an audio action needs it, and check for NULL.
- id: LIVE-7
  notes: live/README.md#live-7
  sev: low
  origin: upstream
  status: D
  title: >-
    Missed audio callbacks are not detected: the recording is spliced silently and the logged time axis falls behind
  refs:
  - repo: blab-mex
    path: TransShiftMex/Audapter.cpp
    lines:
    - 1904
    - 1905
    hl:
    - 1905
    expect: data_recorder[0][data_counter] = frame_counter * p.frameLen + si + 1;
  verify: 'Live simulation (live/run.sh timing): 109 missed periods, 218 ms behind; 0 with SCHED_FIFO.'
  what: >-
    Audapter logs each callback as the next frame, with no timestamp or overrun counter. When the driver drops periods, <code>signalIn</code> is spliced without a
    marker and the logged time, OST onsets and perturbation onsets run behind wall-clock time.
  scope: >-
    Matters on overloaded machines or drivers without real-time priority. In the simulation, with a normal-priority driver thread on a busy CPU, 109 of 5152 periods
    were lost and the time axis ended 218 ms behind; with a real-time driver thread none were lost.
  fix: >-
    Count overruns from the stream time and log them per frame. Workaround: run the audio driver at real-time priority and keep the machine idle.
- id: LIVE-8
  notes: live/README.md#live-8
  sev: low
  origin: upstream
  status: D
  title: Live onset and offset ramps are a 500 Hz sawtooth and end on a negative gain
  refs:
  - repo: blab-mex
    path: TransShiftMex/Audapter.cpp
    lines:
    - 2292
    - 2301
    hl:
    - 2295
    - 2300
    expect: (frame_counter - 1) * frame_size + n
  verify: >-
    Live simulation (live/run.sh ramp): live vs offline gain, maximum difference 0.040, final live gain −0.039.
  what: >-
    With <code>trialLen</code> and <code>rampLen</code> set, the live ramp gain is computed from an index that runs over the interleaved stereo buffer, so within
    each 2 ms frame the ramp advances twice as fast and then jumps back. The gain is a 500 Hz sawtooth of ±0.040 around the intended ramp and ends at −0.039.
  scope: Audible only if speech overlaps the first or last <code>rampLen</code> of a trial.
  fix: Compute the ramp from the frame's sample index, not the interleaved index.
